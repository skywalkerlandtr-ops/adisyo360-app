  if (f.arrayBuffer) return f.arrayBuffer();

}

document.addEventListener('submit', function(e){
  var f = e.target.getAttribute && e.target.getAttribute('data-form');
  if (!f || f.indexOf('mz') !== 0) return;
  e.preventDefault();
  if (f === 'mzBilgi') {
    var haz = sayiOku($('#mzHaz').value), ipt = sayiOku($('#mzIpt').value);
    if (!(haz >= 5 && haz <= 180)) return toast('Hazırlık süresi 5 ile 180 dakika arasında olmalı.', true);
    if (!(ipt >= 0 && ipt <= 30)) return toast('İptal süresi 0 ile 30 dakika arasında olmalı.', true);
    mzAyarKaydet('ekAyarKaydet', { veri:{ HazirlikSuresiDk:haz, IptalSuresiDk:ipt, KarsilamaMesaji:$('#mzKar').value } }, 'mzBilgi');
  } else if (f === 'mzAd') {
    var ad = String($('#mzAdInp').value || '').trim();
    if (ad.length < 2) return toast('Zincirin adını yazın.', true);
    islem('ekMzZincir', { ad:ad }, { busy:'mzAd' }).then(function(r){ if (r) { D.zincir.ad = r.zincir.ad; ciz(); toast('Zincirin adı kaydedildi'); } });
  } else if (f === 'mzSubeAd') {
    var st = SH, b = st.b, sAd = String($('#mzsAd').value || '').trim(), adr = String($('#mzsAdres').value || '').trim(), s = mzSube(b);
    if (sAd.length < 2) return toast('Şube adını yazın.', true);
    var isler = [];
    if (sAd !== s.ad) isler.push({ alan:'ad', deger:sAd });
    if (adr !== (s.adres || '')) isler.push({ alan:'adres', deger:adr });
    if (!isler.length) return sheetKapat();
    var sira = Promise.resolve(true);
    isler.forEach(function(x){
      sira = sira.then(function(ok){ return ok ? islem('ekMzSube', { sb:b, alan:x.alan, deger:x.deger }, { busy:'mzSubeAyar' }).then(function(r){ if (r) D.subeler = r.subeler; return !!r; }) : false; });
    });
    sira.then(function(ok){ if (ok) { sheetKapat(); renderMain(); toast('Şube bilgileri kaydedildi'); } });
  } else if (f === 'mzYeniSube') {
    var st2 = SH, v = { ad:$('#mzyAd').value.trim(), ilce:$('#mzyIlce').value.trim(), telefon:$('#mzyTel').value.trim(), adres:$('#mzyAdres').value.trim(), kaynak:$('#mzyKaynak').value };
    Object.keys(v).forEach(function(k){ st2[k] = v[k]; });
    if (v.ad.length < 2) { st2.hata = 'Şubenin adını yazın (ör. Kadıköy).'; return renderSheet(); }
    st2.hata = '';
    islem('ekMzSubeEkle', v, { busy:'mzYeniSube' }).then(function(r){
      if (!r) return;
      D.subeler = r.subeler; renderMain(); renderTop();
      var est = { tip:'mzEkip', b:r.b, ekip:null, yeni:true };
      sheetAc(est);
      call('ekMzEkip', { sb:r.b }).then(function(x){ if (SH === est && x && x.ok) { est.ekip = x.ekip; renderSheet(); } });
    });
  }
});

/* ---------- yardımcı işlemler ---------- */
function haritaAdresi(o, uyg){
  var k = o.lat && o.lng ? o.lat + ',' + o.lng : '', q = encodeURIComponent(o.adres || '');
  if (uyg === 'yandex') return k ? 'https://yandex.com.tr/maps/?rtext=~' + k + '&rtt=auto' : 'https://yandex.com.tr/maps/?text=' + q;
  if (uyg === 'waze') return k ? 'https://waze.com/ul?ll=' + k + '&navigate=yes' : 'https://waze.com/ul?q=' + q + '&navigate=yes';
  if (uyg === 'apple') return 'https://maps.apple.com/?daddr=' + (k || q) + '&dirflg=d';
  return k ? 'https://www.google.com/maps/dir/?api=1&destination=' + k + '&travelmode=driving' : 'https://www.google.com/maps/search/?api=1&query=' + q;
}
function haritaAc(no, uyg){
  var o = siparis(no);
  if (!o) return;
  disaAc(haritaAdresi(o, uyg || 'google'));
}
function kopyala(metin){
  if (navigator.clipboard && navigator.clipboard.writeText) {
    return navigator.clipboard.writeText(metin).then(function(){ return true; }, function(){ return eskiKopya(metin); });
  }
  return Promise.resolve(eskiKopya(metin));
}
function eskiKopya(metin){
  try {
    var t = document.createElement('textarea');
    t.value = metin; t.setAttribute('readonly', ''); t.style.position = 'fixed'; t.style.opacity = '0';
    document.body.appendChild(t); t.select();
    var ok = document.execCommand('copy');
    t.remove();
    return ok;
  } catch(e){ return false; }
}
function qrCiz(link){
  var el = $('#qr');
  if (!el) return;
  try {
    var q = window.qrcode(0, 'M');
    q.addData(link);
    q.make();
    el.innerHTML = q.createSvgTag({ cellSize:4, margin:0, scalable:true });
  } catch(e){ el.hidden = true; }
}

      var ad = String(k.ad || '').trim() || (k.kademeler.length === 1 && k.kademeler[0].tip === 'bedava' ? k.kademeler[0].n + ' al ' + (k.kademeler[0].n - 1) + ' öde' : k.kademeler.map(function(t){ return t.n + '. ürün ' + (t.tip === 'bedava' ? 'bedava' : t.tip === 'fiyat' ? t.deger + ' TL' : '%' + t.deger + ' indirimli'); }).join(', '));
      var v = { id:k.id || 'K' + Date.now(), ad:ad, hedefler:k.hedefler.map(function(h){ return h.toLocaleLowerCase('tr'); }), kademeler:k.kademeler, tekrar:k.tekrar !== false, aktif:k.aktif !== false, bas:k.bas || '', bit:k.bit || '', sira:KAMP.length + 1 };
      var i = KAMP.map(function(x){ return x.id; }).indexOf(v.id);
      if (i >= 0) KAMP[i] = v; else KAMP.push(v);
      return { ok:true, kampanyalar:kopya(KAMP) };
    },
    ekKampanyaSil:function(d){ KAMP = KAMP.filter(function(x){ return x.id !== d.id; }); return { ok:true, kampanyalar:kopya(KAMP) }; }
  };
  return function(act, d){
    var f = islemler[act];
    var gecikme = act === 'ekYenile' ? 120 : act === 'ekRaporGonder' || act === 'ekAfisGonder' ? 1100 : 380 + Math.random() * 320;
    return new Promise(function(ok){
      setTimeout(function(){
        var r = f ? f(d) : hata('ISTEK', 'Bilinmeyen işlem.');
        r.simdiMs = Date.now();
        ok(r);
      }, gecikme);
    });
  };
}
})();
</script>
