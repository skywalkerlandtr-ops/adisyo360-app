<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="format-detection" content="telephone=no">
<meta name="robots" content="noindex">
<title>Restoran ekranı</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<script>
/* Tema ilk boyamadan önce: Telegram içindeyse Telegram'ın teması, değilse cihazın teması. */
(function(){
  try {
    var w = window.Telegram && window.Telegram.WebApp;
    var dark = (w && w.initData) ? w.colorScheme === 'dark' : !!(window.matchMedia && matchMedia('(prefers-color-scheme: dark)').matches);
    var q = new URLSearchParams(location.search);
    if ((q.get('tema') === 'dark' || q.get('tema') === 'light') && !(w && w.initData)) dark = q.get('tema') === 'dark';
    try { var tp = localStorage.getItem('yourpos360-tema'); if (tp === 'dark' || tp === 'light') dark = tp === 'dark'; } catch (e2) {}
    document.documentElement.setAttribute('data-theme', dark ? 'dark' : 'light');
  } catch (e) {}
})();
</script>
<style>
/* YourPOS 360 · Restoran (tablet) ve kurye ekranı.
   Sipariş sayfasıyla aynı renkler ve aynı dil: sayfa = ikincil zemin, bölümler = kartlar, turuncu vurgu.
   Telefonda tek sütun + durum çipleri; 880px ve üstünde (yatay tablet) dört sütunlu sipariş panosu. */
:root{
  --font:-apple-system,BlinkMacSystemFont,"SF Pro Text",Roboto,"Segoe UI","Helvetica Neue",Arial,sans-serif;
  --bg2:#f1f2f6; --bg:#ffffff; --text:#0f0f0f; --hint:#8a8a8f; --sub:#5d5d63; --link:#2481cc; --sep:#e2e3e8;
  --danger:#cf3a30; --field-bg:#f6f7f9; --field-line:#d5d8de; --focus:#2481cc; --focus-ring:rgb(36 129 204 / .28);
  --accent:#e8590c; --on-accent:#ffffff; --accent-soft:#fdebdf; --accent-ink:#b0420a;
  --ok:#2e9e4f; --on-ok:#ffffff; --ok-ink:#1d7536; --ok-soft:#e1f3e6;
  --danger-fill:#cf3a30; --on-danger:#ffffff; --danger-soft:#fdeceb;
  --warn-soft:#fff2dc; --warn-ink:#7f4600;
  --info-soft:#e3effa; --info-ink:#1c5f97;
  --done-soft:#eceef2; --done-ink:#4c5059;
  --disabled-bg:#e5e7ec; --disabled-text:#8a8a8f;
  --sk:#e2e4e9;
  --toast-bg:#2a2b30; --toast-text:#ffffff;
  --scrim:rgb(10 14 20 / .45);
  --chart:#e8590c; --grid:#e9eaee; --axis:#8a8a8f;
  --shadow:0 1px 2px rgb(16 24 40 / .06),0 1px 3px rgb(16 24 40 / .08);
  --tile0:#fde4cc; --tile1:#fadbd2; --tile2:#f8edc2; --tile3:#dff0d4; --tile4:#d8e7f7;
  --safe-b:max(env(safe-area-inset-bottom,0px),var(--tg-safe-area-inset-bottom,0px));
  /* tam ekranda Telegram'ın üstteki düğmeleri sayfanın üstüne biner: cihaz boşluğu + Telegram boşluğu kadar aşağıdan başlanır */
  --safe-t:calc(max(env(safe-area-inset-top,0px),var(--tg-safe-area-inset-top,0px)) + var(--tg-content-safe-area-inset-top,0px));
  color-scheme:light;
}
:root[data-theme="dark"]{
  --bg2:#0e1621; --bg:#17212b; --text:#f5f5f5; --hint:#708499; --sub:#97a8ba; --link:#6ab3f3; --sep:#25313d;
  --danger:#ff6b61; --field-bg:#0e1621; --field-line:#2c3a48; --focus:#6ab3f3; --focus-ring:rgb(106 179 243 / .3);
  --accent:#ff7a33; --on-accent:#1b0c03; --accent-soft:#3a2518; --accent-ink:#ffa477;
  --ok:#4cc46e; --on-ok:#0b1d10; --ok-ink:#72d891; --ok-soft:#163125;
  --danger-fill:#ff6b61; --on-danger:#1f0605; --danger-soft:#3a1c1e;
  --warn-soft:#382a14; --warn-ink:#ffc77f;
  --info-soft:#17304a; --info-ink:#8cc4f5;
  --done-soft:#202c38; --done-ink:#a9b6c3;
  --disabled-bg:#22303d; --disabled-text:#6f8396;
  --sk:#223040;
  --toast-bg:#2b3846; --toast-text:#f5f5f5;
  --scrim:rgb(0 0 0 / .6);
  --chart:#e8661f; --grid:#25313d; --axis:#708499;
  --shadow:none;
  --tile0:#3b2a1b; --tile1:#3a2320; --tile2:#35301b; --tile3:#1f3122; --tile4:#1b2b3c;
  color-scheme:dark;
}

/* ---------- temel ---------- */
*,*::before,*::after{box-sizing:border-box}
html,body{height:100%}
html{-webkit-text-size-adjust:100%;text-size-adjust:100%}
body{margin:0;background:var(--bg2);color:var(--text);font-family:var(--font);font-size:16px;line-height:1.4;
  overflow:hidden;-webkit-tap-highlight-color:transparent;overscroll-behavior:none}
h1,h2,h3,p,ol,ul,figure,fieldset,legend{margin:0}
ul,ol{padding:0;list-style:none}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;-webkit-user-select:none;user-select:none}
button:disabled{cursor:default}
a{color:var(--link)}
:focus-visible{outline:3px solid var(--focus);outline-offset:2px}
[hidden]{display:none!important}
.num{font-variant-numeric:tabular-nums}
.nw{white-space:nowrap}
.sr{position:absolute!important;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0 0 0 0);clip-path:inset(50%);white-space:nowrap;border:0}
.muted{color:var(--sub)}
.ico{width:20px;height:20px;flex:none;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.ico.sm{width:17px;height:17px}
.ico.lg{width:24px;height:24px}
.spin{flex:none;display:inline-block;width:18px;height:18px;border-radius:50%;border:2.5px solid currentColor;border-right-color:transparent;animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}

/* ---------- kabuk ---------- */
.app{position:fixed;inset:0;display:flex;flex-direction:column;background:var(--bg2)}
.top{flex:none;display:flex;align-items:center;gap:12px;padding:calc(10px + var(--safe-t)) 16px 10px;background:var(--bg);border-bottom:1px solid var(--sep);min-height:64px}
.logo{flex:none;width:42px;height:42px;border-radius:50%;background:var(--accent);color:var(--on-accent);display:grid;place-items:center;font-weight:800;font-size:16px;letter-spacing:.02em}
.top-txt{flex:1;min-width:0}
.top-name{font-size:18px;font-weight:700;line-height:1.2;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.top-sub{font-size:14px;color:var(--sub);display:flex;align-items:center;gap:6px;white-space:nowrap;overflow:hidden}
.top-sub .who{overflow:hidden;text-overflow:ellipsis}
.live{flex:none;width:8px;height:8px;border-radius:50%;background:var(--ok)}
.live.off{background:var(--danger)}
.top-acts{flex:none;display:flex;align-items:center;gap:8px}
.icon-btn{flex:none;width:44px;height:44px;border:0;border-radius:12px;background:var(--bg2);color:var(--text);display:grid;place-items:center}
.icon-btn.on{color:var(--accent-ink);background:var(--accent-soft)}
.icon-btn{position:relative}
.icon-btn .nokta{position:absolute;top:7px;right:7px;width:10px;height:10px;border-radius:50%;background:var(--danger-fill);box-shadow:0 0 0 2px var(--bg)}
.icon-btn:disabled{color:var(--disabled-text)}
.open-sw{flex:none;display:flex;align-items:center;gap:8px;min-height:44px;padding:6px 12px 6px 8px;border:0;border-radius:22px;font-size:15px;font-weight:700;
  background:var(--ok-soft);color:var(--ok-ink)}
.open-sw .knob{width:34px;height:20px;border-radius:10px;background:var(--ok);position:relative;flex:none;transition:background .15s}
.open-sw .knob::after{content:"";position:absolute;top:2px;left:16px;width:16px;height:16px;border-radius:50%;background:var(--bg);transition:left .15s}
.open-sw[aria-checked="false"]{background:var(--danger-soft);color:var(--danger)}
.open-sw[aria-checked="false"] .knob{background:var(--hint)}
.open-sw[aria-checked="false"] .knob::after{left:2px}
.open-sw .l-long{display:none}
@media (min-width:600px){ .open-sw .l-long{display:inline} .open-sw .l-short{display:none} }
@media (max-width:479px){ .top .logo{display:none} .top{gap:8px;padding-left:14px;padding-right:12px} .top-acts{gap:6px} .open-sw{padding-right:10px} }
@media (max-width:359px){ .top .icon-btn{width:40px;height:40px} }

.banners{flex:none;display:flex;flex-direction:column}
.banner{display:flex;align-items:center;gap:10px;padding:10px 16px;font-size:15px;font-weight:600;border-bottom:1px solid var(--sep)}
.banner .b-txt{flex:1;min-width:0}
.banner button{flex:none;min-height:36px;padding:0 14px;border:0;border-radius:18px;font-weight:700;font-size:14px;background:var(--bg);color:inherit}
.banner.warn{background:var(--warn-soft);color:var(--warn-ink)}
.banner.err{background:var(--danger-soft);color:var(--danger)}
.banner.info{background:var(--accent-soft);color:var(--accent-ink)}
.demo-bar{display:flex;align-items:center;flex-wrap:wrap;gap:6px 10px;padding:7px 16px;background:var(--warn-soft);color:var(--warn-ink);font-size:14px;font-weight:600}
.demo-bar .d-roles{display:flex;gap:6px;margin-left:auto}
.demo-bar a{color:inherit;padding:4px 10px;border-radius:14px;text-decoration:none;border:1px solid currentColor;min-height:30px;display:inline-flex;align-items:center}
.demo-bar a[aria-current="page"]{background:var(--warn-ink);color:var(--warn-soft);border-color:var(--warn-ink)}

.main{flex:1;min-height:0;overflow-y:auto;overflow-x:hidden;overscroll-behavior:contain;-webkit-overflow-scrolling:touch;outline:none}
.main.fill{overflow:hidden;display:flex;flex-direction:column}
.scr{padding:14px 16px 24px;display:flex;flex-direction:column;gap:16px;max-width:1280px;margin:0 auto;width:100%}
.main.fill .scr{flex:1;min-height:0;padding-bottom:12px;max-width:none}
.mgrid{display:flex;flex-direction:column;gap:16px}

.tabs{flex:none;display:flex;background:var(--bg);border-top:1px solid var(--sep);padding:0 4px var(--safe-b)}
.tab{flex:1;min-width:0;border:0;background:none;color:var(--sub);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;
  min-height:60px;padding:6px 2px;font-size:13px;font-weight:600;position:relative}
.tab .ico{width:24px;height:24px}
.tab[aria-current="page"]{color:var(--accent-ink)}
.tab[aria-current="page"]::before{content:"";position:absolute;top:0;left:calc(50% - 28px);width:56px;height:3px;border-radius:0 0 3px 3px;background:var(--accent)}
.tab .cnt{position:absolute;top:5px;left:calc(50% + 6px);min-width:20px;height:20px;padding:0 6px;border-radius:10px;background:var(--danger-fill);color:var(--on-danger);
  font-size:12px;font-weight:800;display:grid;place-items:center;font-variant-numeric:tabular-nums}

/* ---------- ortak parçalar ---------- */
.card{background:var(--bg);border-radius:14px;box-shadow:var(--shadow)}
.pad{padding:16px}
.sec-h{display:flex;align-items:baseline;gap:10px;font-size:13px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;color:var(--sub);padding:0 4px}
.sec-h .r{margin-left:auto;text-transform:none;letter-spacing:0;font-weight:600}
.btn{min-height:48px;border:0;border-radius:12px;padding:0 16px;font-weight:700;font-size:16px;display:inline-flex;align-items:center;justify-content:center;gap:8px;
  background:var(--bg2);color:var(--text);text-decoration:none;white-space:nowrap}
.btn.block{width:100%}
.btn.pri{background:var(--accent);color:var(--on-accent)}
.btn.ok{background:var(--ok);color:var(--on-ok)}
.btn.dng{background:var(--danger-fill);color:var(--on-danger)}
.btn.ghost{background:transparent;color:var(--link)}
.btn.line{background:transparent;box-shadow:inset 0 0 0 1.5px var(--field-line)}
.btn.dng-line{background:transparent;color:var(--danger);box-shadow:inset 0 0 0 1.5px currentColor}
.btn.sm{min-height:40px;padding:0 12px;font-size:15px;border-radius:10px}
.btn:disabled{background:var(--disabled-bg);color:var(--disabled-text);box-shadow:none}
.btn.busy:disabled{opacity:.85}
.btn:not(:disabled):active{filter:brightness(.94)}
.chips{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;margin:0 -16px;padding:2px 16px}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;min-height:40px;padding:0 14px;border-radius:20px;border:0;background:var(--bg);color:var(--text);font-weight:600;font-size:15px;
  display:inline-flex;align-items:center;gap:7px;box-shadow:inset 0 0 0 1px var(--sep)}
.chip .n{min-width:22px;height:22px;padding:0 6px;border-radius:11px;background:var(--bg2);font-size:13px;font-weight:800;display:grid;place-items:center;font-variant-numeric:tabular-nums}
.chip[aria-pressed="true"]{background:var(--text);color:var(--bg);box-shadow:none}
.chip[aria-pressed="true"] .n{background:var(--bg);color:var(--text)}
.chip .n.hot{background:var(--danger-fill);color:var(--on-danger)}
.badge{display:inline-flex;align-items:center;gap:5px;padding:2px 9px;border-radius:999px;font-size:13px;font-weight:700;white-space:nowrap;line-height:1.5}
.st-Y{background:var(--accent-soft);color:var(--accent-ink)}
.st-H{background:var(--warn-soft);color:var(--warn-ink)}
.st-R{background:var(--ok-soft);color:var(--ok-ink)}
.st-O{background:var(--info-soft);color:var(--info-ink)}
.st-T{background:var(--done-soft);color:var(--done-ink)}
.st-I{background:var(--danger-soft);color:var(--danger)}
.dot{width:8px;height:8px;border-radius:50%;background:currentColor;flex:none}
.empty{display:flex;flex-direction:column;align-items:center;text-align:center;gap:8px;padding:36px 20px;color:var(--sub)}
.empty .e-ico{width:56px;height:56px;border-radius:50%;background:var(--bg);display:grid;place-items:center;color:var(--hint)}
.empty .e-ico .ico{width:28px;height:28px}
.empty h2{font-size:18px;color:var(--text)}
.empty p{max-width:34ch;font-size:15px}
.field{display:flex;flex-direction:column;gap:6px}
.field label,.field .lbl{font-size:14px;font-weight:600;color:var(--sub)}
.inp{width:100%;min-height:48px;padding:10px 14px;border-radius:12px;border:1.5px solid var(--field-line);background:var(--field-bg);font-size:16px}
.inp:focus{outline:none;border-color:var(--focus);box-shadow:0 0 0 3px var(--focus-ring)}
.err-txt{color:var(--danger);font-size:14px;font-weight:600}
.toolbar{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.upd{font-size:13px;color:var(--sub);display:inline-flex;align-items:center;gap:6px;margin-left:auto}
.upd button{border:0;background:var(--bg);width:36px;height:36px;border-radius:10px;display:grid;place-items:center;color:var(--sub)}

/* ---------- sipariş kartı ---------- */
.olist{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:12px;align-items:start}
.ord{background:var(--bg);border-radius:14px;box-shadow:var(--shadow);display:flex;flex-direction:column;overflow:hidden;position:relative}
.ord.k-Y{box-shadow:inset 0 0 0 2px var(--accent),var(--shadow)}
.ord.k-Y::before{content:"";position:absolute;left:0;top:0;bottom:0;width:6px;background:var(--accent)}
.ord.late::before{background:var(--danger-fill)}
.ord.late{box-shadow:inset 0 0 0 2px var(--danger-fill),var(--shadow)}
.ord-main{border:0;background:none;text-align:left;padding:14px 14px 10px 16px;display:flex;flex-direction:column;gap:6px;width:100%;color:inherit}
.ord.k-Y .ord-main{padding-left:20px}
.ord-top{display:flex;align-items:center;gap:8px;min-width:0}
.ord-no{font-size:20px;font-weight:800;font-variant-numeric:tabular-nums;letter-spacing:-.01em}
.ord-ago{margin-left:auto;font-size:14px;font-weight:600;color:var(--sub);white-space:nowrap;font-variant-numeric:tabular-nums}
.ord-who{font-size:15px;color:var(--sub);display:flex;gap:6px;min-width:0}
.ord-who .nm{font-weight:600;color:var(--text);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ord-items{font-size:16px;line-height:1.4;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.ord-items b{font-variant-numeric:tabular-nums}
.ord-flags{display:flex;flex-wrap:wrap;gap:6px}
.flag{display:inline-flex;align-items:center;gap:5px;padding:3px 9px;border-radius:8px;font-size:14px;font-weight:600;background:var(--bg2);color:var(--sub);max-width:100%}
.flag .t{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.flag.note{background:var(--warn-soft);color:var(--warn-ink)}
.flag.late{background:var(--danger-soft);color:var(--danger)}
.flag.slow{background:var(--warn-soft);color:var(--warn-ink)}
.ord-foot{display:flex;align-items:baseline;gap:8px;font-size:15px}
.ord-total{font-size:18px;font-weight:800;font-variant-numeric:tabular-nums}
.ord-pay{color:var(--sub);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ord-act{padding:0 14px 14px 16px;display:flex;gap:8px}
.ord.k-Y .ord-act{padding-left:20px}
.ord-act .btn{flex:1;min-height:52px;font-size:17px}
.ord.closed{opacity:.92}
.ord.closed .ord-no{color:var(--sub)}
@media (prefers-reduced-motion:no-preference){
  .ord.k-Y.fresh{animation:fresh 1.2s ease-in-out 3}
  @keyframes fresh{50%{transform:scale(1.015)}}
}

/* pano (yatay tablet) */
.board{flex:1;min-height:0;display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}
.col{display:flex;flex-direction:column;min-height:0;background:color-mix(in srgb,var(--bg) 45%,var(--bg2));border-radius:16px}
.col-h{flex:none;display:flex;align-items:center;gap:8px;padding:12px 14px 8px;font-weight:800;font-size:16px}
.col-h .n{margin-left:auto;font-variant-numeric:tabular-nums;min-width:28px;height:26px;padding:0 8px;border-radius:13px;display:grid;place-items:center;font-size:14px}
.col-list{flex:1;min-height:0;overflow-y:auto;padding:4px 10px 12px;display:flex;flex-direction:column;gap:10px;overscroll-behavior:contain}
.col-list > .ord{flex:none}
.col-empty{padding:18px 8px;text-align:center;color:var(--hint);font-size:14px}
.seg{display:inline-flex;background:var(--bg);border-radius:12px;padding:3px;box-shadow:inset 0 0 0 1px var(--sep)}
.seg button{border:0;background:none;min-height:40px;padding:0 14px;border-radius:9px;font-weight:700;font-size:15px;color:var(--sub);display:inline-flex;align-items:center;gap:6px}
.seg button[aria-pressed="true"]{background:var(--text);color:var(--bg)}

/* ---------- alt pencere (sheet) ---------- */
.sheet-wrap{position:fixed;inset:0;z-index:50;display:flex;align-items:flex-end;justify-content:center}
.scrim{position:absolute;inset:0;background:var(--scrim);animation:fade .18s ease-out}
@keyframes fade{from{opacity:0}}
.sheet{position:relative;width:100%;max-width:600px;max-height:92%;background:var(--bg);border-radius:18px 18px 0 0;display:flex;flex-direction:column;
  animation:up .22s ease-out;outline:none}
@keyframes up{from{transform:translateY(40px);opacity:.4}}
@media (min-width:700px) and (min-height:560px){
  .sheet-wrap{align-items:center;padding:24px}
  .sheet{border-radius:18px;max-height:min(88vh,860px)}
}
.sh-head{flex:none;display:flex;align-items:center;gap:10px;padding:14px 12px 10px 18px;border-bottom:1px solid var(--sep)}
.sh-head h2{font-size:20px;font-weight:800;flex:1;min-width:0;display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.sh-body{flex:1;min-height:0;overflow-y:auto;padding:14px 18px 18px;display:flex;flex-direction:column;gap:16px;overscroll-behavior:contain}
.sh-body > *{flex-shrink:0}
.sh-foot{flex:none;padding:12px 18px calc(12px + var(--safe-b));border-top:1px solid var(--sep);display:flex;flex-direction:column;gap:10px}
.sh-foot .row{display:flex;gap:10px}
.sh-foot .row .btn{flex:1}
.blk{display:flex;flex-direction:column;gap:6px}
.blk-h{font-size:13px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;color:var(--sub)}
.big{font-size:18px;font-weight:700}
.kv{display:flex;justify-content:space-between;gap:12px;font-variant-numeric:tabular-nums}
.kv.tot{font-size:18px;font-weight:800;padding-top:6px;border-top:1px dashed var(--sep)}
.items li{display:flex;gap:10px;padding:6px 0;border-bottom:1px solid var(--sep);font-size:16px}
.items li:last-child{border-bottom:0}
.items .q{font-weight:800;min-width:34px;font-variant-numeric:tabular-nums}
.items .a{flex:1;min-width:0}
.items .p{font-variant-numeric:tabular-nums;color:var(--sub);white-space:nowrap}
.items .ks{display:block;font-size:15px;line-height:1.35;margin-top:2px;color:var(--sub)}
.items .ks.cik{color:var(--danger);font-weight:800}
.items .ks.not{font-style:italic}
.k-oz{color:var(--danger);font-weight:600}

/* ---------- menü ---------- */

.sw .knob::after{content:"";position:absolute;top:3px;left:21px;width:22px;height:22px;border-radius:50%;background:#fff;transition:left .15s;box-shadow:0 1px 2px rgb(0 0 0 / .25)}

/* ---------- raporlar ---------- */

.bar{width:min(24px,72%);min-height:0;background:var(--chart);border-radius:4px 4px 0 0}
.bar.zero{height:2px!important;background:var(--grid);border-radius:0}
.ch-x{display:flex;gap:2px;margin-left:44px;font-size:12px;color:var(--axis);font-variant-numeric:tabular-nums}

.tip{position:absolute;z-index:3;pointer-events:none;background:var(--toast-bg);color:var(--toast-text);font-size:13px;line-height:1.35;padding:7px 10px;border-radius:8px;
  white-space:nowrap;transform:translate(-50%,-100%);font-variant-numeric:tabular-nums;box-shadow:0 4px 14px rgb(0 0 0 / .18)}

.donem{font-size:15px;font-weight:700;color:var(--sub);padding:0 4px;display:flex;align-items:center;gap:10px}

/* ---------- tam ekran durumlar ---------- */
.full{position:fixed;inset:0;z-index:60;background:var(--bg2);display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;gap:14px;padding:32px 24px}

.toast{position:fixed;left:50%;top:calc(12px + var(--safe-t));transform:translate(-50%,-20px);opacity:0;z-index:70;background:var(--toast-bg);color:var(--toast-text);
  padding:12px 16px;border-radius:12px;font-size:15px;font-weight:600;max-width:min(92vw,480px);width:max-content;transition:opacity .2s,transform .2s;pointer-events:none;text-align:center}

/* ---------- fiş (yazdırma) ---------- */
.fis{display:none}
@media print{
  @page{margin:4mm}
  body{overflow:visible;background:#fff;color:#000}
  body > *:not(.fis){display:none!important}
  .fis{display:block;font:12px/1.35 ui-monospace,Menlo,Consolas,monospace;width:var(--fis-g,72mm);color:#000}

  .fis .r.k{font-size:14px}

}

.emo{aspect-ratio:1;min-height:54px;border:0;border-radius:12px;font-size:28px;line-height:1;display:grid;place-items:center;padding:0}
.emo[aria-pressed="true"]{box-shadow:0 0 0 3px var(--accent)}
.adim{list-style:decimal;padding-left:22px;display:flex;flex-direction:column;gap:10px}
.sh-head .icon-btn:first-child{margin-left:-6px}

.m-kp{font-size:13px;font-weight:700;color:var(--accent-ink);background:var(--accent-soft);border-radius:8px;padding:2px 8px;align-self:flex-start;margin-top:3px}
.m-gs{display:flex;flex-wrap:wrap;gap:6px 8px;align-items:center;width:100%}
.m-gun{font-size:13px;font-weight:600;color:var(--sub)}
.m-gun.yok{color:var(--danger)}
.m-stok{display:inline-flex;align-items:center;gap:6px;min-height:36px;padding:0 10px;border-radius:10px;border:0;background:var(--bg2);color:var(--text);font-size:14px;font-weight:600}
.m-stok.az{background:var(--warn-soft,#fff3d6);color:var(--warn-ink,#8a5a00)}
.m-stok.bitti{background:var(--danger-soft);color:var(--danger)}
.gunler{display:flex;flex-wrap:wrap;gap:6px}
.oz-grup{border:1.5px solid var(--sep);border-radius:14px;padding:12px;display:flex;flex-direction:column;gap:10px}
.oz-g-bas{display:grid;grid-template-columns:minmax(0,1fr) 44px;gap:8px;align-items:center}
.oz-g-bas .inp{font-weight:700}
.oz-bag{grid-column:1 / -1;font-size:13px;color:var(--ok-ink,#1d7a3a);margin-top:-4px}
.saatler{display:flex;flex-direction:column;gap:8px}
.saat-row{display:grid;grid-template-columns:110px minmax(0,1fr);gap:10px;align-items:center}
.saat-row label{font-weight:600}
.flag.ileri{background:var(--accent-soft);color:var(--accent-ink)}
.note-box.ileri{background:var(--accent-soft);color:var(--accent-ink)}
.items .ks.gr{color:var(--text);font-weight:700}
.m-oz{font-size:13px;font-weight:700;color:var(--sub);background:var(--bg2);border-radius:8px;padding:2px 8px;align-self:flex-start;margin-top:3px}
.oz-blk{gap:8px}
.oz-acik{margin:0;padding:0 0 0 2px;list-style:none;font-size:14px;line-height:1.4;display:flex;flex-direction:column;gap:2px}
.oz-ipucu{font-size:14px;margin:0}
.oz-row{display:grid;grid-template-columns:minmax(0,1fr) 138px 44px;gap:8px;align-items:center}
.oz-sel{padding:10px 8px;font-size:15px;appearance:auto;-webkit-appearance:menulist}
.kplist{display:flex;flex-direction:column;gap:8px}
.kp{display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:12px;background:var(--bg2)}
.kp.off{opacity:.7}
.kp-bas{flex:1;min-width:0;border:0;background:none;text-align:left;color:inherit;font:inherit;display:flex;flex-direction:column;gap:2px;padding:4px 0}
.kp-ad{font-weight:700}
.kp-alt{font-size:14px;color:var(--sub)}
.kpk{display:flex;flex-direction:column;gap:8px}
.kpk-row{display:grid;grid-template-columns:auto minmax(0,1fr) 96px 44px;gap:8px;align-items:center}
.kpk-n{display:inline-flex;align-items:center;gap:4px;font-weight:600;white-space:nowrap}
.kpk-n .inp{width:56px;padding:8px}
@media (max-width:420px){ .kpk-row{grid-template-columns:auto minmax(0,1fr) 44px} .kpk-row > input[id^="kp-d-"]{grid-column:1 / 3} }
.kph{display:flex;flex-direction:column;gap:6px;margin-bottom:6px}
.opt .cbx{width:24px;height:24px;border-radius:6px;box-shadow:inset 0 0 0 2px var(--field-line);flex:none;position:relative}
.opt[aria-checked="true"] .cbx{background:var(--accent);box-shadow:none}
.opt[aria-checked="true"] .cbx::after{content:"";position:absolute;left:8px;top:4px;width:6px;height:11px;border:solid var(--on-accent);border-width:0 2.5px 2.5px 0;transform:rotate(45deg)}
.opt[role="checkbox"][aria-checked="true"]{background:var(--accent-soft);color:var(--accent-ink);box-shadow:inset 0 0 0 2px var(--accent)}
.chip.sm[aria-pressed="true"]{background:var(--accent);color:var(--on-accent);box-shadow:none}
.kv.ind{color:var(--ok-ink);font-weight:600}
/* ---------- ayarlar ---------- */
.ayar .frm{display:flex;flex-direction:column;gap:12px}
.frm-h{font-size:18px;font-weight:800}
.two{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;align-items:end}
.three{align-items:end}
.three{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
.ok-box{display:flex;align-items:center;gap:10px;flex-wrap:wrap;background:var(--ok-soft);color:var(--ok-ink);border-radius:12px;padding:10px 14px;font-weight:600}
.ok-box .btn{margin-left:auto}
.kform{display:flex;gap:8px}
.kform .inp{flex:1;min-width:0}
.bolgeler{display:flex;flex-direction:column;gap:10px}
.bolge{border:1.5px solid var(--sep);border-radius:14px;padding:12px;display:flex;flex-direction:column;gap:10px;min-width:0}
.b-bas{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.b-no{font-weight:800}
.b-km{display:inline-flex;align-items:center;gap:6px;font-weight:600}
.inp.km{width:84px;min-height:42px;padding:6px 10px}
.b-bas .icon-btn{margin-left:auto}
.b-cumle{font-size:14px;color:var(--accent-ink);background:var(--accent-soft);border-radius:10px;padding:8px 12px;font-weight:600}
.odl li{display:flex;align-items:center;gap:8px;padding:6px 0;border-bottom:1px solid var(--sep)}
.odl li:last-child{border-bottom:0}
.odl .od-ad{flex:1;min-width:0;font-weight:600;overflow-wrap:anywhere}
.pk-t{display:flex;flex-wrap:wrap;gap:16px;justify-content:space-between}
.row2{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
/* QR afişleri */
.afis-on{display:flex;justify-content:center;background:var(--bg2);border-radius:14px;padding:14px}
.afis-on canvas{display:block;width:100%;max-width:300px;height:auto;border-radius:6px;box-shadow:0 2px 10px rgb(0 0 0 / .18);background:#fff}
.afis-olcu{display:flex;align-items:stretch;gap:8px}
.afis-olcu .opt{flex:1}
.afis-kutu{flex:none;width:56px;border:0;border-radius:12px;background:var(--bg2);display:grid;place-items:center;color:var(--on-accent);box-shadow:inset 0 0 0 2px var(--field-line)}
.afis-kutu[aria-checked="true"]{background:var(--accent);box-shadow:none}
.afis-kutu .ico{width:22px;height:22px;stroke-width:2.6}
.logo-satir{display:flex;align-items:center;gap:12px}
.logo-on{width:64px;height:64px;object-fit:contain;border-radius:12px;background:#fff;box-shadow:inset 0 0 0 1px var(--sep);padding:4px}
.afis-kart .btn{align-self:flex-start;margin-top:10px}
@media (min-width:1200px){ .scr.ayar{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));align-items:start} .scr.ayar .pk{grid-column:1 / -1} .tile{width:60px;height:60px;font-size:34px} }
/* ---------- geniş ekran (masaüstü, büyük tablet): ekranı doldur, yazıları büyüt ---------- */
@media (min-width:1200px){
  .scr{max-width:none;padding:20px 28px 28px;gap:18px}
  .tip-txt{font-size:15px}
  .sw{font-size:15px}
  .search .inp{min-height:52px;font-size:17px}
  .main.fill .scr{padding:16px 24px 14px}
  .top{min-height:76px;padding-left:24px;padding-right:24px;gap:16px}
  .logo{width:50px;height:50px;font-size:19px}
  .top-name{font-size:22px}
  .top-sub{font-size:16px}
  .open-sw{font-size:17px;min-height:48px;padding:6px 16px 6px 10px}
  .icon-btn{width:48px;height:48px}
  .banner,.demo-bar{font-size:16px;padding-left:24px;padding-right:24px}
  .tab{font-size:16px;min-height:70px}
  .tab .ico{width:28px;height:28px}
  .seg button{font-size:17px;min-height:46px;padding:0 18px}
  .chip{font-size:16px;min-height:44px}
  .upd{font-size:15px}
  .board{gap:18px}
  .col-h{font-size:18px;padding:14px 16px 10px}
  .col-h .badge{font-size:16px;padding:3px 12px}
  .col-h .n{font-size:16px;min-width:32px;height:30px}
  .col-list{padding:4px 12px 14px;gap:12px}
  .ord-main{padding:16px 16px 12px 18px;gap:8px}
  .ord.k-Y .ord-main{padding-left:22px}
  .ord-no{font-size:25px}
  .ord-ago{font-size:16px}
  .ord-who{font-size:17px}
  .ord-items{font-size:19px}
  .flag{font-size:16px;padding:4px 10px}
  .ord-foot{font-size:17px}
  .ord-total{font-size:22px}
  .ord-act{padding:0 16px 16px 18px}
  .ord.k-Y .ord-act{padding-left:22px}
  .ord-act .btn{min-height:60px;font-size:20px}
  .olist{grid-template-columns:repeat(auto-fill,minmax(360px,1fr));gap:16px}
  .badge{font-size:14px}
  .btn{font-size:17px}
  .sheet{max-width:720px}
  .sh-head h2{font-size:23px}
  .sh-body{font-size:17px}
  .items li{font-size:18px}
  .mgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));align-items:start;gap:20px}
  .m-ad{font-size:18px}
  .m-fiyat{font-size:16px}
  .sec-h{font-size:14px}
  .kpi .k-l{font-size:16px}
  .kpi .k-v{font-size:30px}
  .kpi.hero .k-v{font-size:30px}
  .kpi .k-s{font-size:14px}
  .ch-title{font-size:18px}
  .ch-sub{font-size:15px}
  .ch-plot{height:220px;margin-left:60px}
  .ch-x{margin-left:60px;font-size:14px}
  .gl span{font-size:14px;top:-10px}
  .hb .hb-ad{font-size:16px}
  .tbl{font-size:16px}
  .kasa .ks-v b{font-size:17px}
  .p-ad{font-size:17px}
  .kcard{padding:20px;gap:14px}
  .k-adr{font-size:22px}
}
@media (min-width:1700px){
  .mgrid{grid-template-columns:repeat(3,minmax(0,1fr))}
  .rgrid{grid-template-columns:repeat(3,minmax(0,1fr))}
}
@media (prefers-reduced-motion:reduce){ *{animation:none!important;transition:none!important} }
</style>
</head>
<body>
<div class="app" id="app" hidden>
  <header class="top" id="top"></header>
  <div class="banners" id="banners"></div>
  <main class="main" id="main" tabindex="-1"></main>
  <nav class="tabs" id="tabs" aria-label="Bölümler"></nav>
</div>
<div class="sheet-wrap" id="sheetWrap" hidden>
  <div class="scrim" data-act="kapat"></div>
  <div class="sheet" id="sheet" role="dialog" aria-modal="true" aria-labelledby="shTitle" tabindex="-1"></div>
</div>
<div class="full" id="full">
  <div class="f-ico"><span class="spin" style="width:30px;height:30px;border-width:3px" aria-hidden="true"></span></div>
  <h1>Ekran açılıyor…</h1>
</div>
<div class="toast" id="toast" role="status" aria-live="polite"></div>
<div class="fis" id="fis" aria-hidden="true"></div>

function ver(v){ try { return !!(tg && tg.isVersionAtLeast && tg.isVersionAtLeast(v)); } catch(e){ return false; } }
function haptic(kind, v){
  try {
    if (!ver('6.1') || !tg.HapticFeedback) return;
    if (kind === 'impact') tg.HapticFeedback.impactOccurred(v);
    else if (kind === 'select') tg.HapticFeedback.selectionChanged();
    else tg.HapticFeedback.notificationOccurred(v);
  } catch(e){}

function applyTheme(){
  var dark = tg ? tg.colorScheme === 'dark' : !!(window.matchMedia && matchMedia('(prefers-color-scheme: dark)').matches);
  var f = params.get('tema');
  if (!tg && (f === 'dark' || f === 'light')) dark = f === 'dark';
  var tp = LS.get('yourpos360-tema');
  if (tp === 'dark' || tp === 'light') dark = tp === 'dark';
  root.setAttribute('data-theme', dark ? 'dark' : 'light');
  try {
    if (ver('6.1')) {
      var cs = getComputedStyle(root);
      tg.setHeaderColor(cs.getPropertyValue('--bg').trim());
      tg.setBackgroundColor(cs.getPropertyValue('--bg2').trim());

/* ---------- sunucu ---------- */
var MOCK = null;   // önizlemede 5_demo.js doldurur
function auth(){ return inTelegram ? (ANA ? { initData:realTg.initData, ana:1 } : { initData:realTg.initData }) : (CIHAZ ? { cihaz:CIHAZ } : {}); }
function call(act, data){
  var payload = Object.assign({ act:act, b:B }, auth(), MERKEZ ? { merkez:1 } : {}, data || {});
  if (MOCK) return MOCK(act, JSON.parse(JSON.stringify(payload)));
  var body = JSON.stringify(payload);
  var url = API + (API.indexOf('?') >= 0 ? '&' : '?') + 'api=1';
  function dene(n){
    var ctrl = window.AbortController ? new AbortController() : null;
    var zaman = false;
    var t = setTimeout(function(){ zaman = true; if (ctrl) ctrl.abort(); }, 25000);
    return fetch(url, { method:'POST', body:body, redirect:'follow', signal:ctrl ? ctrl.signal : undefined })
      .then(function(res){ return res.text(); })
      .then(function(txt){
        clearTimeout(t);
        var j = null;
        try { j = JSON.parse(txt); } catch(e){}
        if (!j || typeof j !== 'object') return { ok:false, kod:'SUNUCU', hata:'Sunucu beklenmedik bir yanıt verdi. Biraz sonra tekrar deneyin.' };
        if (typeof j.simdiMs === 'number') SKEW = j.simdiMs - Date.now();
        return j;
      })
      .catch(function(e){
        clearTimeout(t);
        if (zaman || (e && e.name === 'AbortError')) return { ok:false, kod:'ZAMAN', hata:'Sunucu geç yanıt verdi. Tekrar deneyin.' };
        if (n === 0) return new Promise(function(r){ setTimeout(r, 1200); }).then(function(){ return dene(1); });
        return { ok:false, kod:'AG', hata:'İnternet bağlantısı yok gibi görünüyor.' };
      });
  }
  return dene(0);
}

function siparis(no){ no = Number(no); for (var i = 0; i < D.siparisler.length; i++) if (D.siparisler[i].no === no) return D.siparisler[i]; return null; }
function siparisKoy(o){
  if (!o) return;
  var i = D.siparisler.findIndex(function(x){ return x.no === o.no; });
  if (i >= 0) D.siparisler[i] = o; else D.siparisler.push(o);

function sahip(){ return D && D.rol === 'Sahip'; }
function kurye(){ return D && D.rol === 'Kurye'; }
var KAPALI = ['T', 'I'];
function kalemOzet(k){
  return (k || []).map(function(x){
    var ek = [];
    if (x.gr && x.gr.length) x.gr.forEach(function(g){ ek.push(g.s.join(', ')); });
    if (x.cikar && x.cikar.length) ek.push(x.cikar.join(', ') + ' olmasın');
    if (x.ekle && x.ekle.length) ek.push('+' + x.ekle.join(', +'));
    if (x.ekstra && x.ekstra.length) ek.push('+' + x.ekstra.map(function(e){ return e.ad; }).join(', +'));
    if (x.not) ek.push('not var');
    return '<b>' + adet(x.adet) + '×</b> ' + esc(x.ad) + (ek.length ? ' <span class="k-oz">(' + esc(kisalt(ek.join(' · '), 60)) + ')</span>' : '');
  }).join(', ');
}
// Müşterinin ürün seçimleri (çıkarılan malzemeler büyük harfle; mutfak gözden kaçırmasın)
function kalemSecimleri(k){
  var l = [];
  if (k.gr && k.gr.length) k.gr.forEach(function(g){ l.push(['gr', g.g + ': ' + g.s.join(', ')]); });
  if (k.cikar && k.cikar.length) l.push(['cik', '✖ ' + k.cikar.join(', ').toLocaleUpperCase('tr') + ' OLMASIN']);
  if (k.ekle && k.ekle.length) l.push(['ekle', '+ ' + k.ekle.join(', ') + ' eklensin']);
  if (k.ekstra && k.ekstra.length) l.push(['ekle', '+ Ekstra: ' + k.ekstra.map(function(e){ return e.ad; }).join(', ')]);
  if (k.not) l.push(['not', '✎ Not: ' + k.not]);
  return l;
}
function kalemSecimHtml(k){
  return kalemSecimleri(k).map(function(x){ return '<span class="ks ' + x[0] + '">' + esc(x[1]) + '</span>'; }).join('');
}
function rozet(k){ return '<span class="badge st-' + k + '"><span class="dot"></span>' + DUR[k].ad + '</span>'; }
function sirala(a, b){
  var ra = ACIK.indexOf(a.kod), rb = ACIK.indexOf(b.kod);
  if (ra !== rb) return ra - rb;
  return a.tarihMs - b.tarihMs;
}
function acikSiparisler(){ return D.siparisler.filter(function(o){ return ACIK.indexOf(o.kod) >= 0; }).sort(sirala); }
function kapananlar(){
  var bugun = gunKey(simdi());
  return D.siparisler.filter(function(o){ return ACIK.indexOf(o.kod) < 0 && gunKey(o.guncelMs || o.tarihMs) === bugun; })
    .sort(function(a, b){ return (b.guncelMs || b.tarihMs) - (a.guncelMs || a.tarihMs); });
}
function sayac(k){ return D.siparisler.filter(function(o){ return o.kod === k; }).length; }
function benim(o){ return o.kuryeId && o.kuryeId === D.ben.id; }
function nakitMi(s){ return /nakit/i.test(String(s || '')); }
function kartMi(s){ return /kart/i.test(String(s || '')); }

/* ---------- ses ve uyarılar ---------- */
var SES = { acik:LS.get('yourpos360-ses') !== '0', ctx:null, son:0 };
// Zil ayarları (bu cihazda): ses, tip (tek · uc · tekrar; boşsa rolün varsayılanı), tekrar aralığı (sn), seviye (%), arka planda çal
var ZIL = (function(){
  var v = {};
  try { v = JSON.parse(LS.get('yourpos360-zil') || '{}') || {}; } catch(e){}
  return { ses:typeof v.ses === 'string' && v.ses ? v.ses : 'klasik', tip:['tek', 'uc', 'tekrar'].indexOf(v.tip) >= 0 ? v.tip : '',
    aralik:[10, 15, 30, 60].indexOf(v.aralik) >= 0 ? v.aralik : 15, seviye:v.seviye >= 10 && v.seviye <= 100 ? v.seviye : 100, arka:v.arka !== false };
})();
function sesCtx(){
  if (!SES.ctx) { var A = window.AudioContext || window.webkitAudioContext; if (A) { try { SES.ctx = new A(); } catch(e){} } }
  return SES.ctx;
}
function sesHazir(){ var c = SES.ctx; return !!(c && c.state === 'running'); }

// Seçili zili çalar (sesler ve ayarlar: 4e_ses.js)
function bip(tur, kez){ return zilCal(kez || 1); }
var WL = null;

var toastT = null;

  var el = $('#toast');
  el.textContent = msg;
  el.className = 'toast on' + (hata ? ' err' : '');
  clearTimeout(toastT);
  toastT = setTimeout(function(){ el.className = 'toast' + (hata ? ' err' : ''); }, hata ? 4200 : 2600);

// Yeni gelenleri yakalar: restoranda yeni sipariş, kuryede yeni «hazır» sipariş
function degisiklikleriIsle(){
  var izlenen = kurye()
    ? D.siparisler.filter(function(o){ return o.kod === 'R' && (!o.kuryeId || benim(o)); })
    : D.siparisler.filter(function(o){ return o.kod === 'Y'; });
  var anahtar = function(o){ return (o.b ? o.b + '/' : '') + o.no + ':' + o.kod; };
  if (GORULEN) {
    var yeniler = izlenen.filter(function(o){ return !GORULEN[anahtar(o)]; });
    if (yeniler.length) {
      yeniler.forEach(function(o){ U.taze[(o.b ? o.b + '/' : '') + o.no] = Date.now(); });
      var no = yeniler.map(function(o){ return '#' + o.no + (o.sube ? ' (' + o.sube + ')' : ''); }).join(', ');
      toast(kurye() ? '📦 Hazır sipariş: ' + no : '🔔 Yeni sipariş: ' + no);
      haptic('notify', 'warning');
      try { if (navigator.vibrate) navigator.vibrate([180, 90, 180]); } catch(e){}
      if (SES.acik && bip(kurye() ? 'kurye' : 'yeni', zilTip() === 'uc' ? 3 : 1)) SES.son = Date.now();
    }
  }
  GORULEN = {};
  D.siparisler.forEach(function(o){ GORULEN[anahtar(o)] = 1; });
  yzKontrol();
}
// «Onaylanana kadar» zil tipinde: restoranda sipariş onaylanana, kuryede hazır sipariş alınana kadar seçilen aralıkla çalar
setInterval(function(){
  if (!D) return;
  var bekleyen = kurye() ? 0 : sayac('Y');
  document.title = (bekleyen ? '(' + bekleyen + ') Yeni sipariş · ' : '') + ekranAdi();
  if (SES.acik && zilTip() === 'tekrar' && zilBekleyen() && Date.now() - SES.son >= ZIL.aralik * 1000) { if (bip('yeni')) SES.son = Date.now(); }
}, 1000);

/* ---------- canlı yenileme ---------- */
var pollT = null, pollHata = 0, nesil = 0, sonTam = 0;
function pollPlanla(ms){
  clearTimeout(pollT);
  pollT = setTimeout(poll, ms !== undefined ? ms : (document.hidden ? 30000 : Math.min(30000, 10000 + pollHata * 10000)));
}
function poll(){
  clearTimeout(pollT);
  if (!D) return;
  // Ekip, cihaz ve menü listeleri 5 dakikada bir tazelenir
  if (Date.now() - sonTam > 300000) return tamYenile().then(function(){ pollPlanla(); });
  var benimNesil = nesil;
  return call('ekYenile', { rev:D.rev }).then(function(r){
    if (!r || !r.ok) return hataIsle(r);
    pollHata = 0; U.net = true; U.sonOk = Date.now();
    if (r.subeler) D.subeler = r.subeler;
    if (benimNesil !== nesil) return;   // bu arada bir işlem yapıldı; bir sonraki tur doğru veriyi getirir
    if (!r.ayni) {
      D.rev = r.rev;
      if (r.siparisler) D.siparisler = r.siparisler;
      if (typeof r.acik === 'boolean') D.isletme.acik = r.acik;
      if (r.saat) D.isletme.saat = r.saat;
      degisiklikleriIsle();
      ciz(true);
    } else { if (r.saat) D.isletme.saat = r.saat; renderTop(); }
    renderBanners();
  }).then(function(){ pollPlanla(); }, function(){ pollPlanla(); });
}
function hataIsle(r){
  r = r || {};
  if (r.kod === 'GIRIS' || r.kod === 'YETKI' || r.kod === 'ISLETME') { cikisEkrani(r); return; }
  pollHata++;
  U.net = false;
  renderTop(); renderBanners();
}
function tamYenile(){
  var benimNesil = nesil;
  return call('ekBaslat').then(function(r){
    if (!r || !r.ok) return hataIsle(r);
    sonTam = Date.now(); pollHata = 0; U.net = true; U.sonOk = Date.now();
    if (benimNesil !== nesil) return;
    var sekme = U.tab;
    D = r;
    U.tab = sekme;
    degisiklikleriIsle();
    ciz(true);
    if (SH && SH.tip === 'siparis') renderSheet();
  });
}
document.addEventListener('visibilitychange', function(){
  if (!document.hidden && D) { ekranAcikKalsin(); pollPlanla(0); }
});
window.addEventListener('online', function(){ if (D) pollPlanla(0); });

// Sunucuya değişiklik gönderir; düğmede bekleme gösterir, sonucu ekrana işler
function islem(act, data, opt){
  opt = opt || {};
  var anahtar = opt.busy || (act + ':' + (data && (data.no || data.id || data.uyeId || data.cihazId) || ''));
  if (U.busy[anahtar]) return Promise.resolve(null);
  U.busy[anahtar] = true;
  nesil++;
  ciz();
  if (SH) renderSheet();
  return call(act, data).then(function(r){
    delete U.busy[anahtar];
    if (!r || !r.ok) {
      if (r && (r.kod === 'GIRIS' || r.kod === 'YETKI') && act !== 'ekUyeSil') { cikisEkrani(r); return null; }
      toast((r && r.hata) || 'İşlem yapılamadı.', true);
      haptic('notify', 'error');
      ciz();
      if (SH) renderSheet();
      return null;
    }
    U.net = true; U.sonOk = Date.now();
    if (r.siparis) { siparisKoy(r.siparis); yzKontrol(); }
    if (r.menu) D.menu = r.menu;
    if (r.urunLimiti) D.urunLimiti = r.urunLimiti;
    if (r.ekip) D.ekip = r.ekip;
    if (r.cihazlar) D.cihazlar = r.cihazlar;
    if (typeof r.acik === 'boolean' && act === 'ekAcik') D.isletme.acik = r.acik;
    haptic('notify', 'success');
    ciz();
    pollPlanla(1500);
    return r;
  });
}

/* ---------- ekranı çizme ---------- */
var main = $('#main');
function odakAnahtari(el){
  if (!el || !el.getAttribute) return '';
  var a = el.getAttribute('data-act');
  if (!a) return el.id ? '#' + el.id : '';
  return a + '|' + (el.getAttribute('data-no') || '') + '|' + (el.getAttribute('data-id') || '') + '|' + (el.getAttribute('data-k') || '');
}
function odakBul(k, kap){
  if (!k) return null;
  if (k.charAt(0) === '#') return document.getElementById(k.slice(1));
  var p = k.split('|');
  return $$('[data-act="' + p[0] + '"]', kap).filter(function(el){
    return (el.getAttribute('data-no') || '') === p[1] && (el.getAttribute('data-id') || '') === p[2] && (el.getAttribute('data-k') || '') === p[3];
  })[0] || null;
}
function koruyarakYaz(kap, html){
  var ae = document.activeElement;
  var odak = kap.contains(ae) ? odakAnahtari(ae) : '';
  var kay = {};
  $$('[data-scroll]', kap).forEach(function(el){ kay[el.getAttribute('data-scroll')] = el.scrollTop; });
  var st = kap.scrollTop;
  kap.innerHTML = html;
  kap.scrollTop = st;
  $$('[data-scroll]', kap).forEach(function(el){ var v = kay[el.getAttribute('data-scroll')]; if (v) el.scrollTop = v; });
  if (odak) { var y = odakBul(odak, kap); if (y) try { y.focus({ preventScroll:true }); } catch(e){ y.focus(); } }
}
// yoklamadan gelen çizimde, kişi bir alana yazıyorsa ana bölüm yeniden çizilmez
function ciz(yoklama){
  if (!D) return;
  renderTop(); renderBanners(); renderTabs();
  var ae = document.activeElement;
  var yaziyor = ae && main.contains(ae) && /^(INPUT|TEXTAREA|SELECT)$/.test(ae.tagName);
  if (yoklama && yaziyor) return;
  if (yoklama && !siparisGorunumu()) return;
  renderMain();
}
function siparisGorunumu(){ return kurye() || U.tab === 'siparis'; }

function renderTop(){
  if (!D) return;
  if (merkez()) return mzTopCiz();
  var i = D.isletme;
  var rolAd = D.cihaz ? D.ben.ad + ' · ' + (kurye() ? 'kurye cihazı' : 'tablet') : D.ben.ad + ' · ' + D.rol;
  var canli = U.net
    ? '<span class="live" aria-hidden="true"></span><span class="sr">Bağlantı canlı.</span>'
    : '<span class="live off" aria-hidden="true"></span><span class="sr">Bağlantı yok.</span>';
  var h = '<div class="logo" aria-hidden="true">' + esc(basHarf(i.ad)) + '</div>' +
    '<div class="top-txt"><div class="top-name">' + esc(i.ad) + '</div>' +
    '<div class="top-sub">' + canli + '<span class="who">' + esc(rolAd) + '</span></div></div><div class="top-acts">';
  if (!kurye()) {
    var b = U.busy['ekAcik:'];
    h += '<button class="open-sw" role="switch" aria-checked="' + (i.acik ? 'true' : 'false') + '" data-act="acik"' + (b ? ' disabled' : '') +
      ' aria-label="Sipariş alımı">' + (b ? '<span class="spin" aria-hidden="true"></span>' : '<span class="knob" aria-hidden="true"></span>') +
      '<span class="l-short">' + (i.acik ? 'Açık' : 'Kapalı') + '</span><span class="l-long">' + (i.acik ? 'Sipariş alıyor' : 'Sipariş almıyor') + '</span></button>';
  }
  if (!kurye() && (!inTelegram || YZ.acik)) {
    var yzUyari = YZ.acik && !yzHazir();
    h += '<button class="icon-btn' + (yzHazir() ? ' on' : '') + '" data-act="yazici" aria-label="Fiş yazıcısı: ' +
      (yzHazir() ? 'açık' : yzUyari ? 'bağlı değil' : 'kapalı') + '">' + ic('yazici') + (yzUyari ? '<span class="nokta" aria-hidden="true"></span>' : '') + '</button>';
  }
  if (tamEkranDugmesi()) {
    var te = tamEkranda();

function ileri(o){
  if (o.kod === 'Y') return { ad:'Onayla, hazırla', cls:'pri', ic:'tik' };
  if (o.kod === 'H') return { ad:'Hazır', cls:'ok', ic:'kutu' };
  if (o.kod === 'R') return { ad:D.kuryeler && D.kuryeler.length ? 'Kuryeye ver' : 'Yola çıktı', cls:'pri', ic:'kurye' };
  if (o.kod === 'O') return { ad:'Teslim edildi', cls:'ok', ic:'tikDaire' };
  return null;
}
function siparisKarti(o, rozetli){
  var acik = ACIK.indexOf(o.kod) >= 0;
  var sure = D.isletme.hazirlikDk || 20;
  // ileri saatli sipariş: teslim saatine hazırlık + yol kadar kala «geç» sayılır
  var gec = o.teslimMs ? (o.kod === 'Y' && simdi() > o.teslimMs - (sure + 30) * 60000) : (o.kod === 'Y' && dkGecti(o.tarihMs) >= 5);
  var yavas = o.kod === 'H' && dkGecti(o.tarihMs) > sure;
  var taze = U.taze[o.no] && Date.now() - U.taze[o.no] < 8000;
  var bayrak = '';
  if (o.teslimMs && KAPALI.indexOf(o.kod) < 0) bayrak += '<span class="flag ileri' + (gec ? ' late' : '') + '">' + ic('saat', 'sm') + '<span class="t">' + saatYaz(o.teslimMs) + '\'de teslim' + (gec ? ' · hazırlamaya başlayın' : '') + '</span></span>';
  else if (gec) bayrak += '<span class="flag late">' + ic('saat', 'sm') + '<span class="t">' + dkGecti(o.tarihMs) + ' dk\'dır bekliyor</span></span>';
  if (o.kod === 'H') bayrak += '<span class="flag' + (yavas ? ' slow' : '') + '">' + ic('saat', 'sm') + '<span class="t num">' + dkGecti(o.tarihMs) + ' / ' + sure + ' dk</span></span>';
  if (o.not) bayrak += '<span class="flag note">' + ic('not', 'sm') + '<span class="t">' + esc(kisalt(o.not, 48)) + '</span></span>';
  if (o.kurye && (o.kod === 'O' || o.kod === 'T')) bayrak += '<span class="flag">' + ic('kurye', 'sm') + '<span class="t">' + esc(o.kurye) + '</span></span>';
  if (U.yzHata && U.yzHata[o.no]) bayrak += '<span class="flag late">' + ic('yazici', 'sm') + '<span class="t">Fiş yazdırılamadı</span></span>';
  if (o.kod === 'I') bayrak += '<span class="flag late"><span class="t">' + esc(o.iptalEden || 'İptal') + (o.iptalNedeni ? ': ' + esc(o.iptalNedeni) : '') + '</span></span>';
  var a = acik ? ileri(o) : null;
  var busy = U.busy['ileri:' + o.no];
  return '<article class="ord k-' + o.kod + (gec ? ' late' : '') + (taze ? ' fresh' : '') + (acik ? '' : ' closed') + '" aria-label="Sipariş ' + o.no + '">' +
    '<button class="ord-main" data-act="ac" data-no="' + o.no + '">' +
      '<span class="ord-top"><span class="ord-no">#' + o.no + '</span>' + (rozetli ? rozet(o.kod) : '') +
        '<span class="ord-ago" data-ago="' + o.tarihMs + '">' + once(o.tarihMs) + '</span></span>' +
      '<span class="ord-who"><span class="nm">' + esc(o.ad || 'Müşteri') + '</span>' + (o.km ? '<span>· ' + kmYaz(o.km) + '</span>' : '') + '</span>' +
      '<span class="ord-items">' + kalemOzet(o.kalemler) + '</span>' +
      (bayrak ? '<span class="ord-flags">' + bayrak + '</span>' : '') +
      '<span class="ord-foot"><span class="ord-total">' + tl(o.toplam) + '</span><span class="ord-pay">' + esc(o.odeme) + '</span></span>' +
    '</button>' +
    (a ? '<div class="ord-act"><button class="btn ' + a.cls + '" data-act="ileri" data-no="' + o.no + '"' + (busy ? ' disabled' : '') + '>' +
      (busy ? '<span class="spin" aria-hidden="true"></span>' : ic(a.ic)) + a.ad + '</button></div>' : '') +
  '</article>';
}

  var seg = [['aktif', 'Aktif', acik.length], ['Y', 'Yeni', sayac('Y')], ['H', 'Hazırlanıyor', sayac('H')], ['R', 'Hazır', sayac('R')],

      : U.seg === 'aktif' ? bosDurum('zil', 'Açık sipariş yok', bosMetin)
      : bosDurum('fis', DUR[U.seg].ad + ' sipariş yok', '');
  } else {
    h += '<div class="olist">' + liste.map(function(o){ return siparisKarti(o, U.seg === 'aktif' || U.seg === 'kapali'); }).join('') + '</div>';

function tlKisa(v){ return v >= 1000 ? NF1.format(v / 1000) + ' bin' : NF.format(v); }
function olcek(max, tam){

  var kaba = max / 3, us = Math.pow(10, Math.floor(Math.log(kaba) / Math.LN10)), n = kaba / us;

var tipEl = null;
function ipucu(slot){
  var fig = slot.closest('.chart');
  if (!fig) return;
  if (!tipEl || !fig.contains(tipEl)) { if (tipEl) tipEl.remove(); tipEl = document.createElement('div'); tipEl.className = 'tip'; fig.appendChild(tipEl); }
  $$('.slot.act', fig).forEach(function(s){ s.classList.remove('act'); });
  slot.classList.add('act');
  tipEl.innerHTML = slot.getAttribute('data-tip');
  var fr = fig.getBoundingClientRect(), sr = slot.getBoundingClientRect(), bar = slot.firstChild.getBoundingClientRect();
  var w = tipEl.offsetWidth, x = sr.left + sr.width / 2 - fr.left;
  x = Math.max(w / 2 + 4, Math.min(fr.width - w / 2 - 4, x));
  tipEl.style.left = x + 'px';
  tipEl.style.top = Math.max(tipEl.offsetHeight + 4, bar.top - fr.top - 8) + 'px';
}
function ipucuGizle(){ if (tipEl) { tipEl.remove(); tipEl = null; } $$('.slot.act').forEach(function(s){ s.classList.remove('act'); }); }
main.addEventListener('pointerover', function(e){ var s = e.target.closest && e.target.closest('.slot'); if (s) ipucu(s); });
main.addEventListener('pointerdown', function(e){ var s = e.target.closest && e.target.closest('.slot'); if (s) ipucu(s); else if (!e.target.closest || !e.target.closest('.tip')) ipucuGizle(); });
main.addEventListener('pointerout', function(e){
  var p = e.target.closest && e.target.closest('.ch-plot');
  if (p && e.pointerType === 'mouse' && !(e.relatedTarget && p.contains(e.relatedTarget))) ipucuGizle();
});
main.addEventListener('scroll', ipucuGizle, { passive:true });

/* ---------- fiş yazıcısı (bu cihaza bağlı) ----------
   Onaylanan (Hazırlanıyor'a geçen) sipariş, bu cihazda yazıcı açıksa otomatik yazdırılır.
   Yöntemler: Bluetooth (ESC/POS, Chrome), USB (ESC/POS, Chrome), bilgisayar yazıcısı (tarayıcının yazdırma penceresi).
   Yazıcıya ulaşılamazsa sipariş sistemde normal devam eder; kartta «yazdırılamadı» görünür ve elle tekrar denenir. */
var YZ_KEY = 'yourpos360-yazici-' + B, YZ_IZ = 'yourpos360-yazdi-' + B;
var YZ = (function(){
  var v = null;
  try { v = JSON.parse(LS.get(YZ_KEY) || 'null'); } catch(e){}
  return Object.assign({ acik:false, yontem:'', genislik:80, kopya:1, tr:true, cihaz:null }, v || {});
})();
var YZD = { bagli:false, ad:'', mesgul:false };   // anlık bağlantı durumu
var yzBag = null;                                  // { yaz: function(Uint8Array) → Promise }
var yazdi = {};
(function(){ try { (JSON.parse(LS.get(YZ_IZ) || '[]')).forEach(function(n){ yazdi[n] = 1; }); } catch(e){} })();
var yzIlk = true, yzQ = Promise.resolve();
if (!U.yzHata) U.yzHata = {};

function yzKaydet(){ LS.set(YZ_KEY, JSON.stringify(YZ)); }
function yazdiIsaretle(nolar){
  nolar.forEach(function(n){ yazdi[n] = 1; });
  LS.set(YZ_IZ, JSON.stringify(Object.keys(yazdi).map(Number).sort(function(a, b){ return b - a; }).slice(0, 300)));
}
function yzDestek(){ return { bt:!!(navigator.bluetooth && navigator.bluetooth.requestDevice), usb:!!(navigator.usb && navigator.usb.requestDevice), tarayici:!inTelegram }; }
function yzHazir(){ return YZ.acik && (YZ.yontem === 'tarayici' || YZ.yontem === 'test' || YZD.bagli); }

// Her veri yenilemesinde: yeni onaylanan siparişleri bul, yazıcı açıksa sıraya koy
function yzKontrol(){
  if (!D || kurye()) return;
  var kabul = D.siparisler.filter(function(o){ return ['H', 'R', 'O'].indexOf(o.kod) >= 0 && !yazdi[o.no]; });
  if (!kabul.length) { yzIlk = false; return; }
  // Ekran ilk açıldığında zaten onaylanmış siparişler tekrar basılmaz
  if (yzIlk || !YZ.acik) { yzIlk = false; yazdiIsaretle(kabul.map(function(o){ return o.no; })); return; }
  var taze = kabul.filter(function(o){ return simdi() - o.tarihMs < 12 * 3600000; });
  yazdiIsaretle(kabul.map(function(o){ return o.no; }));
  taze.sort(function(a, b){ return a.no - b.no; }).forEach(function(o){ yzKuyruk(o); });
}
function yzKuyruk(o, elle){
  yzQ = yzQ.then(function(){
    return yazdir(o).then(function(){
      delete U.yzHata[o.no];
      if (elle) toast('🖨 #' + o.no + ' yazdırıldı');
      ciz(true);
    }, function(e){
      U.yzHata[o.no] = 1;
      toast('🖨 #' + o.no + ' yazdırılamadı' + (e && e.message ? ' (' + e.message + ')' : '') + '. Sipariş sistemde devam ediyor.', true);
      ciz(true);
      if (SH && SH.tip === 'siparis') renderSheet();
    });
  });
  return yzQ;
}
function yazdir(o){
  var y = YZ.yontem || 'tarayici';
  if (y === 'tarayici') return tarayiciYazdir(o);
  var bytes = fisBayt(o);
  if (y === 'test') { window.__yzBytes = (window.__yzBytes || []).concat([bytes]); return Promise.resolve(); }
  return yzBaglanti().then(function(b){
    var p = Promise.resolve();
    for (var i = 0; i < (YZ.kopya || 1); i++) p = p.then(function(){ return b.yaz(bytes); });
    return p;
  });
}
function tarayiciYazdir(o){
  return new Promise(function(ok, hata){
    if (inTelegram) return hata(new Error('Telegram içinde yazdırılamaz'));
    fisHtml(o);
    setTimeout(function(){ try { window.print(); ok(); } catch(e){ hata(e); } }, 60);
  });
}

var CP857 = { 'Ç':0x80, 'ü':0x81, 'é':0x82, 'â':0x83, 'ä':0x84, 'à':0x85, 'ç':0x87, 'ê':0x88, 'ë':0x89, 'è':0x8A, 'î':0x8C, 'ı':0x8D, 'Ä':0x8E,
  'É':0x90, 'ô':0x93, 'ö':0x94, 'û':0x96, 'İ':0x98, 'Ö':0x99, 'Ü':0x9A, 'Ş':0x9E, 'ş':0x9F, 'á':0xA0, 'í':0xA1, 'ó':0xA2, 'ú':0xA3,
  'ñ':0xA4, 'Ñ':0xA5, 'Ğ':0xA6, 'ğ':0xA7 };
var SADE = { 'ç':'c', 'Ç':'C', 'ğ':'g', 'Ğ':'G', 'ı':'i', 'İ':'I', 'ö':'o', 'Ö':'O', 'ş':'s', 'Ş':'S', 'ü':'u', 'Ü':'U', 'â':'a', 'î':'i', 'û':'u',
  '×':'x', '–':'-', '—':'-', '·':'-', '’':"'", '‘':"'", '“':'"', '”':'"', '…':'...', '₺':'TL', '✖':'X', '✎':'>', ' ':' ' };
function escKod(s){
  var out = [];
  Array.from(String(s || '')).forEach(function(ch){
    var c = ch.charCodeAt(0);
    if (c < 128) out.push(c);
    else if (YZ.tr && CP857[ch] !== undefined) out.push(CP857[ch]);
    else if (SADE[ch] !== undefined) SADE[ch].split('').forEach(function(x){ out.push(x.charCodeAt(0)); });
    else if (CP857[ch] !== undefined) out.push(CP857[ch]);
    else out.push(63);
  });
  return out;
}
function satirBol(s, n){
  var kelime = String(s || '').replace(/\s+/g, ' ').trim().split(' '), l = [], c = '';
  kelime.forEach(function(w){
    while (w.length > n) { if (c) { l.push(c); c = ''; } l.push(w.slice(0, n)); w = w.slice(n); }
    if (!c) c = w; else if ((c + ' ' + w).length <= n) c += ' ' + w; else { l.push(c); c = w; }
  });
  if (c) l.push(c);
  return l.length ? l : [''];
}
function fisBayt(o){
  var n = YZ.genislik === 58 ? 32 : 48, b = [];
  var ESC = 27, GS = 29;
  var yaz = function(s){ b.push.apply(b, escKod(s)); };
  var sat = function(s){ yaz(s); b.push(10); };
  var cizgi = function(){ sat(new Array(n + 1).join('-')); };
  var hiza = function(x){ b.push(ESC, 97, x); };
  var kalin = function(x){ b.push(ESC, 69, x ? 1 : 0); };
  var boy = function(x){ b.push(GS, 33, x); };          // 0 normal, 1 çift yükseklik, 17 çift en+boy
  var ikiyana = function(a, c){ var bos = n - a.length - c.length; if (bos < 1) { sat(a); hiza(2); sat(c); hiza(0); } else sat(a + new Array(bos + 1).join(' ') + c); };
  var para = function(x){ return tl(x).replace(/ /g, ' '); };
  b.push(ESC, 64);                                        // sıfırla
  if (YZ.tr) b.push(ESC, 116, 13);                        // PC857 Türkçe
  hiza(1); kalin(1); sat(D.isletme.ad); kalin(0);
  boy(17); sat('#' + o.no); boy(0);
  sat(gunYaz(gunKey(o.tarihMs), true) + ' ' + saatYaz(o.tarihMs));
  hiza(0); cizgi();
  if (o.teslimMs) { hiza(1); boy(17); kalin(1); sat('TESLIM ' + saatYaz(o.teslimMs)); kalin(0); boy(0); hiza(0); cizgi(); }
  kalin(1); satirBol(o.ad || 'Müşteri', n).forEach(sat); kalin(0);
  if (o.tel) sat('Tel: ' + telGoster(o.tel));
  satirBol(o.adres, n).forEach(sat);
  if (o.tarif) satirBol('Tarif: ' + o.tarif, n).forEach(sat);
  cizgi();
  (o.kalemler || []).forEach(function(k){
    boy(1); kalin(1);
    satirBol(adet(k.adet) + 'x ' + k.ad, n).forEach(sat);
    kalin(0); boy(0);
    kalemSecimleri(k).forEach(function(x){
      if (x[0] === 'cik') { boy(1); kalin(1); }
      satirBol('  ' + x[1], n).forEach(sat);
      if (x[0] === 'cik') { kalin(0); boy(0); }
    });
    hiza(2); sat(para(k.tutar)); hiza(0);
  });
  cizgi();
  ikiyana('Ürünler', para(o.ara));
  if (o.indirim) ikiyana('Kampanya indirimi', '-' + para(o.indirim));
  ikiyana('Teslimat', o.ucret ? para(o.ucret) : 'Ücretsiz');
  boy(1); kalin(1); ikiyana('TOPLAM', para(o.toplam)); kalin(0); boy(0);
  ikiyana('Ödeme', o.odeme || '');
  if (o.not) { cizgi(); boy(1); kalin(1); satirBol('NOT: ' + o.not, n).forEach(sat); kalin(0); boy(0); }
  cizgi(); hiza(1); sat('YourPOS 360'); hiza(0);
  b.push(10, 10, 10, 10, GS, 86, 66, 0);                 // kağıdı ilerlet ve kes
  return new Uint8Array(b);
}

var BT_SERVIS = ['000018f0-0000-1000-8000-00805f9b34fb', 'e7810a71-73ae-499d-8c15-faa9aef0c3f2', '49535343-fe7d-4ae5-8fa9-9fafd205e455',
  '0000ff00-0000-1000-8000-00805f9b34fb', '0000fee7-0000-1000-8000-00805f9b34fb', '0000ae30-0000-1000-8000-00805f9b34fb'];
function btBaglan(dev){
  return dev.gatt.connect().then(function(srv){
    return srv.getPrimaryServices().then(function(svcs){
      var p = Promise.resolve(null);
      svcs.forEach(function(sv){
        p = p.then(function(bulunan){
          if (bulunan) return bulunan;
          return sv.getCharacteristics().then(function(cs){
            return cs.filter(function(c){ return c.properties.writeWithoutResponse || c.properties.write; })[0] || null;
          }, function(){ return null; });
        });
      });
      return p;
    });
  }).then(function(ch){
    if (!ch) throw new Error('yazıcı bulunamadı');
    dev.addEventListener('gattserverdisconnected', function(){ YZD.bagli = false; yzBag = null; renderTop(); });
    YZD.bagli = true; YZD.ad = dev.name || 'Bluetooth yazıcı';
    yzBag = { yaz:function(bytes){
      var p = Promise.resolve();
      for (var i = 0; i < bytes.length; i += 180) {
        (function(parca){
          p = p.then(function(){ return ch.properties.writeWithoutResponse && ch.writeValueWithoutResponse ? ch.writeValueWithoutResponse(parca) : ch.writeValue(parca); })
            .then(function(){ return new Promise(function(r){ setTimeout(r, 20); }); });
        })(bytes.slice(i, i + 180));
      }
      return p;
    } };
    return yzBag;
  });
}
function usbBaglan(dev){
  return dev.open().then(function(){ return dev.configuration ? null : dev.selectConfiguration(1); }).then(function(){
    var bul = null;
    dev.configuration.interfaces.forEach(function(itf){
      itf.alternates.forEach(function(alt){
        alt.endpoints.forEach(function(ep){ if (!bul && ep.direction === 'out' && ep.type === 'bulk') bul = { itf:itf.interfaceNumber, ep:ep.endpointNumber }; });
      });
    });
    if (!bul) throw new Error('yazıcı çıkışı bulunamadı');
    return dev.claimInterface(bul.itf).then(function(){
      YZD.bagli = true; YZD.ad = dev.productName || 'USB yazıcı';
      yzBag = { yaz:function(bytes){ return dev.transferOut(bul.ep, bytes); } };
      return yzBag;
    });
  });
}
// Daha önce izin verilen yazıcıya sormadan yeniden bağlanır
function yzBaglanti(){
  if (yzBag && YZD.bagli) return Promise.resolve(yzBag);
  if (YZ.yontem === 'bt' && navigator.bluetooth && navigator.bluetooth.getDevices) {
    return navigator.bluetooth.getDevices().then(function(l){
      var d = l.filter(function(x){ return YZ.cihaz && x.id === YZ.cihaz.id; })[0];
      if (!d) throw new Error('yazıcı seçilmemiş');
      return btBaglan(d);
    });
  }
  if (YZ.yontem === 'usb' && navigator.usb) {
    return navigator.usb.getDevices().then(function(l){
      var d = l.filter(function(x){ return YZ.cihaz && x.vendorId === YZ.cihaz.v && x.productId === YZ.cihaz.p; })[0];
      if (!d) throw new Error('yazıcı takılı değil');
      return usbBaglan(d);
    });
  }
  return Promise.reject(new Error('yazıcı bağlı değil'));
}
function yzSec(){
  YZD.mesgul = true; renderSheet();
  var p;
  if (YZ.yontem === 'bt') {
    p = navigator.bluetooth.requestDevice({ acceptAllDevices:true, optionalServices:BT_SERVIS }).then(function(dev){
      YZ.cihaz = { id:dev.id, ad:dev.name || '' }; yzKaydet();
      return btBaglan(dev);
    });
  } else {
    p = navigator.usb.requestDevice({ filters:[] }).then(function(dev){
      YZ.cihaz = { v:dev.vendorId, p:dev.productId, ad:dev.productName || '' }; yzKaydet();
      return usbBaglan(dev);
    });
  }
  return p.then(function(){ YZD.mesgul = false; toast('🖨 Yazıcı bağlandı: ' + YZD.ad); renderSheet(); renderTop(); },
    function(e){ YZD.mesgul = false; if (!(e && e.name === 'NotFoundError')) toast('Yazıcı bağlanamadı: ' + ((e && e.message) || 'bilinmeyen hata'), true); renderSheet(); });
}

// Taslaktaki seçimleri sunucuya gidecek hale getirir; hata varsa { hata }
function ozCoz(oz){
  if (!oz || !oz.acik) return { oz:null };
  var gor = {}, ic = [], ek = [], hata = '';
  oz.ic.forEach(function(m){
    var a = String(m.a || '').replace(/\s+/g, ' ').trim();
    if (!a) return;
    if (gor[trKucuk(a)]) { hata = hata || '«' + a + '» iki kez yazılmış.'; return; }
    gor[trKucuk(a)] = 1;
    ic.push({ a:a, v:m.d === '0' ? 0 : 1, c:m.d === '2' ? 0 : 1 });
  });
  oz.ek.forEach(function(e){
    var a = String(e.a || '').replace(/\s+/g, ' ').trim(), f = fiyatCoz(e.f);
    if (!a && !String(e.f || '').trim()) return;
    if (!a) { hata = hata || 'Her ekstra fiyatının yanına adını yazın (ör. Kaşar peyniri).'; return; }
    if (gor[trKucuk(a)]) { hata = hata || '«' + a + '» iki kez yazılmış.'; return; }
    gor[trKucuk(a)] = 1;
    if (!(f > 0)) { hata = hata || '«' + a + '» ekstrası için fiyat yazın. Ücretsizse İçindekiler\'e «İsteğe bağlı» olarak ekleyin.'; return; }
    ek.push({ a:a, f:f });
  });
  var gr = [];
  oz.gr.forEach(function(g){
    var a = String(g.a || '').replace(/\s+/g, ' ').trim(), mm = String(g.mm || '1-1').split('-'), min = Number(mm[0]), max = Number(mm[1]), sg = {}, s = [];
    g.s.forEach(function(o){
      var oa = String(o.a || '').replace(/\s+/g, ' ').trim(), fs = String(o.f || '').trim(), f = fs ? fiyatCoz(fs) : 0;
      if (!oa && !fs) return;
      if (!oa) { hata = hata || '«' + (a || 'Seçim') + '» grubunda fiyatın yanına seçenek adını yazın.'; return; }
      if (sg[trKucuk(oa)]) { hata = hata || '«' + oa + '» iki kez yazılmış.'; return; }
      sg[trKucuk(oa)] = 1;
      if (fs && !(f > 0)) { hata = hata || '«' + oa + '» için fiyatı doğru yazın.'; return; }
      s.push(f ? { a:oa, f:f } : { a:oa });
    });
    if (!a && !s.length) return;
    if (!a) { hata = hata || 'Seçim grubunun adını yazın (ör. Ana yemek).'; return; }
    if (!s.length) { hata = hata || '«' + a + '» grubuna seçenek ekleyin.'; return; }
    if (max > s.length) { hata = hata || '«' + a + '» grubunda en az ' + max + ' seçenek olmalı.'; return; }
    var fy = g.fy && min === 1 && max === 1;
    if (fy && s.some(function(o){ return !(o.f > 0); })) { hata = hata || '«' + a + '» menünün fiyatını belirliyor: her seçeneğin fiyatını yazın.'; return; }
    var x = { a:a, min:min, max:max, s:s };
    if (fy) x.fy = 1;
    gr.push(x);
  });
  if (hata) return { hata:hata };
  if (!ic.length && !ek.length && !oz.not && !gr.length) return { oz:null };
  return { oz:{ ic:ic, ek:ek, not:oz.not ? 1 : 0, gr:gr } };
}
function urunTaslakOku(s){
  var al = function(id){ var e = document.getElementById(id); return e ? e.value : null; };
  var v;
  if ((v = al('urAd')) !== null) s.ad = v;
  if ((v = al('urKat')) !== null) s.kat = v;
  if ((v = al('urAc')) !== null) s.aciklama = v;
  if ((v = al('urFiyat')) !== null) s.fiyat = v;

    if ((v = al('sv-ad-' + i)) !== null) x.ad = v;
    if ((v = al('sv-f-' + i)) !== null) x.fiyat = v;
  });
  if ((v = al('urPorsiyon')) !== null) s.gunluk = v;
  if (s.oz) {
    s.oz.gr.forEach(function(g, i){
      if ((v = al('oz-gr-a-' + i)) !== null) g.a = v;
      if ((v = al('oz-gr-mm-' + i)) !== null) g.mm = v;
      g.s.forEach(function(o, j){
        if ((v = al('oz-gr-s-a-' + i + '-' + j)) !== null) o.a = v;
        if ((v = al('oz-gr-s-f-' + i + '-' + j)) !== null) o.f = v;
      });
    });
    s.oz.ic.forEach(function(m, i){
      if ((v = al('oz-ic-a-' + i)) !== null) m.a = v;
      if ((v = al('oz-ic-d-' + i)) !== null) m.d = v;
    });
    s.oz.ek.forEach(function(e, i){
      if ((v = al('oz-ek-a-' + i)) !== null) e.a = v;
      if ((v = al('oz-ek-f-' + i)) !== null) e.f = v;
    });
  }
}
function fiyatCoz(v){
  v = String(v || '').replace(/\s|TL|₺/gi, '');
  if (/^\d{1,3}(\.\d{3})+(,\d+)?$/.test(v)) v = v.replace(/\./g, '');
  v = Number(v.replace(',', '.'));
  return v > 0 && v <= 1000000 ? Math.round(v * 100) / 100 : NaN;
}

function sayiOku(v){ v = String(v || '').replace(/\s|TL|₺|km/gi, '').replace(',', '.'); return v === '' ? 0 : Number(v); }
function bolgeCumle(k, i){
  var bas = i === 0 ? 0 : sayiOku(U.ayK[i - 1].max), son = sayiOku(k.max);
  var ucret = sayiOku(k.ucret), min = sayiOku(k.minSiparis), ucs = sayiOku(k.ucretsiz);
  if (!(son > bas)) return 'Bitiş mesafesi başlangıçtan büyük olmalı.';
  var p = [];
  p.push((bas ? kmYaz(bas) + ' – ' : '') + kmYaz(son) + (bas ? ' arası' : '\'ye kadar') + ':');

function konumCoz(t){
  t = String(t || '').trim();
  if (/maps\.app\.goo\.gl|goo\.gl\/maps/.test(t)) return { hata:'Kısa linkler okunamıyor. Google Haritalar\'da dükkânın yerine uzun basın, üstte çıkan koordinatı (ör. 41.0082, 28.9784) kopyalayıp yapıştırın.' };
  var m = /!3d(-?\d+(?:\.\d+)?)!4d(-?\d+(?:\.\d+)?)/.exec(t) || /@(-?\d+(?:\.\d+)?),\s*(-?\d+(?:\.\d+)?)/.exec(t) ||
    /[?&](?:q|query|ll|destination|daddr)=(-?\d+(?:\.\d+)?)(?:,|%2C)\s*(-?\d+(?:\.\d+)?)/i.exec(t) || /^\s*(-?\d{1,2}\.\d{3,})\s*[,;\s]\s*(-?\d{1,3}\.\d{3,})\s*$/.exec(t);
  if (!m) return { hata:'Koordinat okunamadı. Örnek: 41.0082, 28.9784' };
  var lat = Number(m[1]), lng = Number(m[2]);
  if (!(Math.abs(lat) <= 90 && Math.abs(lng) <= 180)) return { hata:'Koordinat geçersiz.' };
  return { lat:lat, lng:lng };
}

/* ---------- QR afişleri (yalnız sahip) ----------
 * Müşteri QR'ı Telegram'la okutunca işletmenin botu açılır (t.me/BOT?start=qr).
 * Afiş tarayıcıda çizilir; baskı ölçüleri tek PDF'te, Instagram hikâyesi ayrı

  { k:'kare', ad:'10×10 cm cam etiketi', alt:'Cam, kapı', w:700, h:700, mm:[100, 100] },
  { k:'hikaye', ad:'Instagram hikâyesi', alt:'1080×1920 görsel', w:1080, h:1920, resim:true }
];

var AFIS_RENK = {
  restoran:{ a:'#E4572E', k:'#8C2B12', y:'#FFE6DC' },
  kafe:{ a:'#9A6440', k:'#4B2C19', y:'#F4E6D8' },

  diger:{ a:'#3B6FD8', k:'#1B3B7E', y:'#E1EAFB' }
};
var AFIS_FONT = 'system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif';
var LOGO_SINIR = 45000;   // Ayarlar hücresine sığsın diye (karakter)

function afisOlcu(k){ return AFIS_OLCU.filter(function(o){ return o.k === k; })[0] || AFIS_OLCU[0]; }
function afisTur(){ var t = D && D.isletme && D.isletme.tur; return AFIS_RENK[t] ? t : 'diger'; }
function afisLink(){ return D && D.botAdi ? 'https://t.me/' + D.botAdi + '?start=qr' : ''; }
function afisMetin(){
  var m = afisTur() === 'market';
  return { bas:m ? 'Telegram\'dan alışveriş yapın' : 'Telegram\'dan sipariş verin', en:m ? 'Scan to shop on Telegram' : 'Scan to order on Telegram',
    adim:['Kamerayla okutun', m ? 'Ürünleri seçin' : 'Menüden seçin', 'Sipariş verin'] };

/* --- çizim yardımcıları --- */
function afRR(c, x, y, w, h, r){
  r = Math.min(r, w / 2, h / 2);
  c.beginPath(); c.moveTo(x + r, y); c.arcTo(x + w, y, x + w, y + h, r); c.arcTo(x + w, y + h, x, y + h, r);
  c.arcTo(x, y + h, x, y, r); c.arcTo(x, y, x + w, y, r); c.closePath();
}
function afFont(c, px, kalin){ c.font = (kalin ? '800 ' : '500 ') + Math.round(px) + 'px ' + AFIS_FONT; }
// Metni en fazla «satir» satıra böler; sığmazsa yazıyı küçültür
function afSatirlar(c, metin, maxW, px, kalin, satir, enAz){
  metin = String(metin || '').replace(/\s+/g, ' ').trim();
  if (!metin) return { px:px, l:[] };
  for (var p = px; p >= enAz; p *= 0.94) {
    afFont(c, p, kalin);
    var kel = metin.split(' '), l = [], s = '';
    for (var i = 0; i < kel.length; i++) {
      var dene = s ? s + ' ' + kel[i] : kel[i];
      if (c.measureText(dene).width <= maxW || !s) s = dene; else { l.push(s); s = kel[i]; }
    }
    if (s) l.push(s);
    var tasan = l.some(function(x){ return c.measureText(x).width > maxW; });
    if (l.length <= satir && !tasan) return { px:p, l:l };
  }
  afFont(c, enAz, kalin);
  var k = metin;
  while (k.length > 1 && c.measureText(k + '…').width > maxW) k = k.slice(0, -1);
  return { px:enAz, l:[k === metin ? k : k + '…'] };
}
function afYaz(c, s, x, y, renk, kalin, hiza){
  afFont(c, s.px, kalin);
  c.fillStyle = renk; c.textAlign = hiza || 'center'; c.textBaseline = 'top';
  s.l.forEach(function(t, i){ c.fillText(t, x, y + i * s.px * 1.18); });
  return s.l.length * s.px * 1.18;
}
function afQR(link){
  var q = window.qrcode(0, 'M');
  q.addData(link); q.make();
  return q;
}
function afQRCiz(c, q, x, y, boy, renk){
  var n = q.getModuleCount(), m = boy / n;
  c.fillStyle = renk;
  for (var r = 0; r < n; r++) for (var k = 0; k < n; k++) {
    if (q.isDark(r, k)) c.fillRect(Math.floor(x + k * m), Math.floor(y + r * m), Math.ceil(m) + 0.5, Math.ceil(m) + 0.5);
  }
}
function afBasHarf(ad){
  var w = String(ad || '').trim().split(/\s+/).filter(Boolean);
  return ((w[0] ? w[0].charAt(0) : '') + (w[1] ? w[1].charAt(0) : '')).toLocaleUpperCase('tr-TR') || 'M';
}
// İşletme türüne göre küçük süs simgesi (çizgi)
function afIkon(c, tur, cx, cy, s, renk, kal){
  c.save(); c.strokeStyle = renk; c.fillStyle = renk; c.lineWidth = kal; c.lineCap = 'round'; c.lineJoin = 'round';
  c.beginPath();
  if (tur === 'kafe') {
    afRR(c, cx - s * 0.42, cy - s * 0.1, s * 0.62, s * 0.5, s * 0.12); c.stroke();
    c.beginPath(); c.arc(cx + s * 0.26, cy + s * 0.14, s * 0.13, -Math.PI / 2, Math.PI / 2); c.stroke();
    [-0.24, -0.06, 0.12].forEach(function(dx){ c.beginPath(); c.moveTo(cx + dx * s, cy - s * 0.2); c.quadraticCurveTo(cx + dx * s + s * 0.08, cy - s * 0.32, cx + dx * s, cy - s * 0.44); c.stroke(); });
  } else if (tur === 'pastane') {
    c.moveTo(cx - s * 0.36, cy); c.lineTo(cx - s * 0.26, cy + s * 0.42); c.lineTo(cx + s * 0.26, cy + s * 0.42); c.lineTo(cx + s * 0.36, cy); c.closePath(); c.stroke();
    c.beginPath(); c.arc(cx, cy, s * 0.36, Math.PI, 0); c.stroke();
    c.beginPath(); c.arc(cx, cy - s * 0.44, s * 0.07, 0, Math.PI * 2); c.fill();
  } else if (tur === 'market') {
    c.moveTo(cx - s * 0.46, cy - s * 0.3); c.lineTo(cx - s * 0.32, cy - s * 0.3); c.lineTo(cx - s * 0.2, cy + s * 0.2); c.lineTo(cx + s * 0.34, cy + s * 0.2);
    c.lineTo(cx + s * 0.44, cy - s * 0.16); c.lineTo(cx - s * 0.27, cy - s * 0.16); c.stroke();
    [-0.12, 0.26].forEach(function(dx){ c.beginPath(); c.arc(cx + dx * s, cy + s * 0.36, s * 0.07, 0, Math.PI * 2); c.fill(); });
  } else if (tur === 'restoran') {
    c.arc(cx, cy, s * 0.3, 0, Math.PI * 2); c.stroke();
    c.beginPath(); c.moveTo(cx - s * 0.48, cy - s * 0.36); c.lineTo(cx - s * 0.48, cy + s * 0.4);
    c.moveTo(cx - s * 0.56, cy - s * 0.36); c.lineTo(cx - s * 0.56, cy - s * 0.12); c.moveTo(cx - s * 0.4, cy - s * 0.36); c.lineTo(cx - s * 0.4, cy - s * 0.12);
    c.moveTo(cx + s * 0.5, cy - s * 0.36); c.quadraticCurveTo(cx + s * 0.62, cy - s * 0.1, cx + s * 0.5, cy); c.lineTo(cx + s * 0.5, cy + s * 0.4); c.stroke();
  } else {
    for (var i = 0; i < 10; i++) {
      var a = -Math.PI / 2 + i * Math.PI / 5, r = i % 2 ? s * 0.2 : s * 0.46;
      if (i) c.lineTo(cx + Math.cos(a) * r, cy + Math.sin(a) * r); else c.moveTo(cx + Math.cos(a) * r, cy + Math.sin(a) * r);
    }
    c.closePath(); c.stroke();
  }
  c.restore();
}

/* --- afiş --- o: { w, h, stil, tur, ad, aciklama, telefon, link, bot, logo (Image|null) } */
function afisCiz(cv, o){
  cv.width = o.w; cv.height = o.h;
  var c = cv.getContext('2d'), W = o.w, H = o.h, u = W / 100;

  }

  }
  var adS = afSatirlar(c, o.ad, 86 * u, 8.2 * u, true, 2, 4.6 * u);

  var rozet = logoH ? logoH + (sade ? 0 : 3.6 * u) : 14 * u;
  var basH = rozet + 2.6 * u + adS.l.length * adS.px * 1.18 + (acS ? 1.2 * u + acS.l.length * acS.px * 1.18 : 0);

      if (!sade) { c.fillStyle = '#FFFFFF'; afRR(c, bx, y, bw, bh, 3 * u); c.fill(); }
      c.drawImage(o.logo, (W - logoW) / 2, y + (bh - logoH) / 2, logoW, logoH);
    } else {
      c.fillStyle = sade ? R.a : '#FFFFFF';
      c.beginPath(); c.arc(W / 2, y + rozet / 2, rozet / 2, 0, Math.PI * 2); c.fill();
      afFont(c, rozet * 0.4, true); c.fillStyle = sade ? '#FFFFFF' : (gece ? '#121418' : R.a); c.textAlign = 'center'; c.textBaseline = 'middle';
      c.fillText(afBasHarf(o.ad), W / 2, y + rozet / 2 + rozet * 0.02);
    }

  var bS = afSatirlar(c, metin.bas, 90 * u, 6.4 * u, true, 2, 4 * u);
  var enS = afSatirlar(c, metin.en, 86 * u, 3.2 * u, false, 1, 2.4 * u);
  var cagriH = bS.l.length * bS.px * 1.18 + 0.8 * u + enS.px * 1.18;

  var adimH = 7 * u + 1.6 * u + Math.max.apply(null, adimS.map(function(s){ return s.l.length * s.px * 1.18; }));
  bloklar.push({ h:adimH, ciz:function(y){
    adimS.forEach(function(s, i){

      afFont(c, 3.6 * u, true); c.fillStyle = sade ? R.k : gece ? '#FFFFFF' : R.a; c.textAlign = 'center'; c.textBaseline = 'middle';
      c.fillText(String(i + 1), cx, y + r + 0.15 * u);
      if (i < 2) { c.strokeStyle = sade ? R.y : 'rgba(255,255,255,.5)'; c.lineWidth = 0.45 * u; c.beginPath(); c.moveTo(cx + r + 2 * u, y + r); c.lineTo(cx + 30 * u - r - 2 * u, y + r); c.stroke(); }

  var telS = o.telefon ? afSatirlar(c, 'Tel: ' + o.telefon, 80 * u, 4.2 * u, true, 1, 3 * u) : null;
  var altS = afSatirlar(c, 'YourPOS 360 · komisyonsuz sipariş', 80 * u, 2.4 * u, false, 1, 2 * u);
  var altH = (telS ? telS.px * 1.18 + 1.4 * u : 0) + altS.px * 1.18;
  bloklar.push({ h:altH, ciz:function(y){

/* --- PDF (her sayfa bir JPEG) --- */

  nesne(2, function(){ ekle('<< /Type /Pages /Kids [' + sayfalar.map(function(s, i){ return (3 + i * 3) + ' 0 R'; }).join(' ') + '] /Count ' + n + ' >>'); });

    var icerik = 'q ' + pw + ' 0 0 ' + ph + ' 0 0 cm /Im' + i + ' Do Q';

    nesne(p + 1, function(){ ekle('<< /Length ' + icerik.length + ' >>\nstream\n' + icerik + '\nendstream'); });
    nesne(p + 2, function(){

function b64Bayt(dataUrl){

}
function baytB64(b){

/* --- logo: dosyayı küçültüp veri adresine çevirir (şeffaflık varsa PNG) --- */
function resimYukle(src){
  return new Promise(function(ok, hata){
    var im = new Image();
    im.onload = function(){ ok(im); };
    im.onerror = function(){ hata(new Error('RESIM')); };
    im.src = src;
  });

function logoHazirla(dosya){
  if (!dosya || !/^image\//.test(dosya.type || '')) return Promise.reject(new Error('Lütfen bir resim dosyası seçin (PNG, JPG).'));
  if (dosya.size > 15 * 1024 * 1024) return Promise.reject(new Error('Resim çok büyük. 15 MB\'tan küçük bir dosya seçin.'));
  var url = URL.createObjectURL(dosya);
  return resimYukle(url).then(function(im){
    URL.revokeObjectURL(url);
    var cv = document.createElement('canvas'), c = cv.getContext('2d');
    function boyut(maks){
      var o = Math.min(1, maks / Math.max(im.width, im.height));
      cv.width = Math.max(1, Math.round(im.width * o)); cv.height = Math.max(1, Math.round(im.height * o));
      c.clearRect(0, 0, cv.width, cv.height); c.drawImage(im, 0, 0, cv.width, cv.height);
    }
    boyut(64);
    var d = c.getImageData(0, 0, cv.width, cv.height).data, seffaf = false;
    for (var i = 3; i < d.length; i += 4) if (d[i] < 245) { seffaf = true; break; }
    var olcu = [360, 300, 240, 200, 160], sonuc = '';
    for (var k = 0; k < olcu.length && !sonuc; k++) {
      boyut(olcu[k]);
      if (seffaf) { var p = cv.toDataURL('image/png'); if (p.length <= LOGO_SINIR) sonuc = p; }
      if (!sonuc) {
        if (seffaf) { var t = document.createElement('canvas'); t.width = cv.width; t.height = cv.height; var tc = t.getContext('2d'); tc.fillStyle = '#FFFFFF'; tc.fillRect(0, 0, t.width, t.height); tc.drawImage(cv, 0, 0); cv = t; c = tc; }
        for (var q = 0.9; q >= 0.6 && !sonuc; q -= 0.1) { var j = cv.toDataURL('image/jpeg', q); if (j.length <= LOGO_SINIR) sonuc = j; }
      }
    }
    if (!sonuc) throw new Error('Logo küçültülemedi. Daha sade bir resim deneyin.');
    return sonuc;
  }, function(){ URL.revokeObjectURL(url); throw new Error('Resim açılamadı. PNG ya da JPG bir dosya seçin.'); });
}

function zCan(c, h, t, f, sure, tepe){

  s.buffer = b; f.type = 'bandpass'; f.frequency.value = 2600; f.Q.value = 1.2; g.gain.value = tepe;

// Zili çal: kez = arka arkaya kaç kez, onizle = seçilen sesi denemek için (arka plan kuralı uygulanmaz)
function zilCal(kez, onizle){
  var c = sesCtx();
  if (!c || c.state !== 'running') return false;
  if (!onizle && !ZIL.arka && document.hidden) return false;
  var k = onizle || ZIL.ses;
  if (k === 'kendi' && !ZIL_KENDI.buf) k = 'klasik';
  var h = c.createGain();
  h.gain.value = Math.max(0.05, Math.min(1, ZIL.seviye / 100));
  h.connect(c.destination);
  var t = c.currentTime + 0.03;
  for (var i = 0; i < (kez || 1); i++) {
    var sure;
    if (k === 'kendi') {
      var s = c.createBufferSource();
      s.buffer = ZIL_KENDI.buf; s.connect(h);
      sure = Math.min(ZIL_KENDI.buf.duration, 12);
      s.start(t, 0, sure);
    } else sure = (ZIL_CAL[k] || ZIL_CAL.klasik)(c, h, t);
    t += sure + 0.35;
  }
  return true;
}

function zilDb(){
  return new Promise(function(ok, no){
    try {
      var r = indexedDB.open('yourpos360-zil', 1);
      r.onupgradeneeded = function(){ r.result.createObjectStore('dosya'); };
      r.onsuccess = function(){ ok(r.result); };
      r.onerror = function(){ no(r.error); };
    } catch(e){ no(e); }
  });
}
function zilDbIs(mod, f){
  return zilDb().then(function(db){
    return new Promise(function(ok, no){
      var tx = db.transaction('dosya', mod), st = tx.objectStore('dosya'), sonuc;
      var q = f(st);
      if (q) q.onsuccess = function(){ sonuc = q.result; };
      tx.oncomplete = function(){ ok(sonuc); };
      tx.onerror = tx.onabort = function(){ no(tx.error); };
    });
  });
}
function zilCoz(ab){
  var c = sesCtx();
  return new Promise(function(ok, no){
    if (!c) return no(new Error('ses yok'));
    try { var p = c.decodeAudioData(ab.slice(0), ok, no); if (p && p.then) p.then(ok, no); } catch(e){ no(e); }
  });
}
