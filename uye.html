<title>YourPOS 360 · Panelim</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<script>
(function(){
  try {
    var w = window.Telegram && window.Telegram.WebApp;
    var dark = (w && w.initData) ? w.colorScheme === 'dark' : !!(window.matchMedia && matchMedia('(prefers-color-scheme: dark)').matches);
    var q = new URLSearchParams(location.search);
    if ((q.get('tema') === 'dark' || q.get('tema') === 'light') && !(w && w.initData)) dark = q.get('tema') === 'dark';
    document.documentElement.setAttribute('data-theme', dark ? 'dark' : 'light');
  } catch (e) {}
})();
</script>
<style>
/* YourPOS 360 · Üyelik ve işletme paneli (uye.html). Restoran ekranıyla aynı renkler. */
:root{
  --font:-apple-system,BlinkMacSystemFont,"SF Pro Text",Roboto,"Segoe UI","Helvetica Neue",Arial,sans-serif;
  --bg2:#f1f2f6; --bg:#ffffff; --text:#0f0f0f; --hint:#8a8a8f; --sub:#5d5d63; --link:#2481cc; --sep:#e2e3e8;
  --danger:#cf3a30; --field-bg:#f6f7f9; --field-line:#d5d8de; --focus:#2481cc; --focus-ring:rgb(36 129 204 / .28);
  --accent:#e8590c; --on-accent:#ffffff; --accent-soft:#fdebdf; --accent-ink:#b0420a;
  --ok:#2e9e4f; --on-ok:#ffffff; --ok-ink:#1d7536; --ok-soft:#e1f3e6;
  --danger-fill:#cf3a30; --on-danger:#ffffff; --danger-soft:#fdeceb;
  --warn-soft:#fff2dc; --warn-ink:#7f4600;
  --info-soft:#e3effa; --info-ink:#1c5f97;
  --done-soft:#eceef2; --done-ink:#4c5059;
  --disabled-bg:#e5e7ec; --disabled-text:#8a8a8f;
  --sk:#e2e4e9;
  --toast-bg:#2a2b30; --toast-text:#ffffff;
  --scrim:rgb(10 14 20 / .45);
  --chart:#e8590c; --grid:#e9eaee; --axis:#8a8a8f;
  --shadow:0 1px 2px rgb(16 24 40 / .06),0 1px 3px rgb(16 24 40 / .08);
  --tile0:#fde4cc; --tile1:#fadbd2; --tile2:#f8edc2; --tile3:#dff0d4; --tile4:#d8e7f7;
  --safe-b:max(env(safe-area-inset-bottom,0px),var(--tg-safe-area-inset-bottom,0px));
  --safe-t:max(env(safe-area-inset-top,0px),var(--tg-content-safe-area-inset-top,0px));
  color-scheme:light;
}
:root[data-theme="dark"]{
  --bg2:#0e1621; --bg:#17212b; --text:#f5f5f5; --hint:#708499; --sub:#97a8ba; --link:#6ab3f3; --sep:#25313d;
  --danger:#ff6b61; --field-bg:#0e1621; --field-line:#2c3a48; --focus:#6ab3f3; --focus-ring:rgb(106 179 243 / .3);
  --accent:#ff7a33; --on-accent:#1b0c03; --accent-soft:#3a2518; --accent-ink:#ffa477;
  --ok:#4cc46e; --on-ok:#0b1d10; --ok-ink:#72d891; --ok-soft:#163125;
  --danger-fill:#ff6b61; --on-danger:#1f0605; --danger-soft:#3a1c1e;
  --warn-soft:#382a14; --warn-ink:#ffc77f;
  --info-soft:#17304a; --info-ink:#8cc4f5;
  --done-soft:#202c38; --done-ink:#a9b6c3;
  --disabled-bg:#22303d; --disabled-text:#6f8396;
  --sk:#223040;
  --toast-bg:#2b3846; --toast-text:#f5f5f5;
  --scrim:rgb(0 0 0 / .6);
  --chart:#e8661f; --grid:#25313d; --axis:#708499;
  --shadow:none;
  --tile0:#3b2a1b; --tile1:#3a2320; --tile2:#35301b; --tile3:#1f3122; --tile4:#1b2b3c;
  color-scheme:dark;
}

/* ---------- temel ---------- */
*,*::before,*::after{box-sizing:border-box}
html{-webkit-text-size-adjust:100%;text-size-adjust:100%}
/* Sayfa belgenin kendisiyle kayar (önceden body overflow:hidden olduğu için parmakla kaydırılamıyordu) */
body{margin:0;background:var(--bg2);color:var(--text);font-family:var(--font);font-size:16px;line-height:1.4;
  min-height:100%;-webkit-tap-highlight-color:transparent;overscroll-behavior-y:none}
html.sh-acik,html.sh-acik body{overflow:hidden}
select.inp:disabled{opacity:.6}
h1,h2,h3,p,ol,ul,figure,fieldset,legend{margin:0}
ul,ol{padding:0;list-style:none}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;-webkit-user-select:none;user-select:none}
button:disabled{cursor:default}
a{color:var(--link)}
:focus-visible{outline:3px solid var(--focus);outline-offset:2px}
[hidden]{display:none!important}
.num{font-variant-numeric:tabular-nums}
.nw{white-space:nowrap}
.sr{position:absolute!important;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0 0 0 0);clip-path:inset(50%);white-space:nowrap;border:0}
.muted{color:var(--sub)}
.ico{width:20px;height:20px;flex:none;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.ico.sm{width:17px;height:17px}
.ico.lg{width:24px;height:24px}
.spin{flex:none;display:inline-block;width:18px;height:18px;border-radius:50%;border:2.5px solid currentColor;border-right-color:transparent;animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}

.num{font-variant-numeric:tabular-nums}

.wrap{max-width:720px;margin:0 auto;padding:16px 16px calc(28px + var(--safe-b));display:flex;flex-direction:column;gap:16px}
.grid2{display:flex;flex-direction:column;gap:16px}
@media (min-width:1100px){ .wrap{max-width:1200px} .grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px;align-items:start} }
.card{background:var(--bg);border-radius:16px;box-shadow:var(--shadow);padding:18px;display:flex;flex-direction:column;gap:12px;min-width:0}
.card h2{font-size:19px;font-weight:800;display:flex;align-items:center;gap:10px}
.blk-h{font-size:13px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;color:var(--sub)}
.tip{font-size:14px;color:var(--sub)}
.btn{min-height:50px;border:0;border-radius:12px;padding:0 18px;font-weight:700;font-size:16px;display:inline-flex;align-items:center;justify-content:center;gap:8px;
  background:var(--bg2);color:var(--text);text-decoration:none;text-align:center}
.btn.block{width:100%}
.btn.pri{background:var(--accent);color:var(--on-accent)}
.btn.ok{background:var(--ok);color:var(--on-ok)}
.btn.line{background:transparent;box-shadow:inset 0 0 0 1.5px var(--field-line)}
.btn.ghost{background:transparent;color:var(--link);padding:0 6px;min-height:40px;justify-content:flex-start;text-align:left}
.btn.sm{min-height:40px;padding:0 14px;font-size:15px;border-radius:10px}
.btn:disabled{background:var(--disabled-bg);color:var(--disabled-text);box-shadow:none}
.btn:not(:disabled):active{filter:brightness(.94)}
.row{display:flex;gap:10px;flex-wrap:wrap}
.row > .btn{flex:1 1 160px}
.field{display:flex;flex-direction:column;gap:6px}
.field label,.field .lbl{font-size:14px;font-weight:600;color:var(--sub)}
.field .opt-l{font-weight:500;color:var(--hint)}
.inp{width:100%;min-height:50px;padding:10px 14px;border-radius:12px;border:1.5px solid var(--field-line);background:var(--field-bg);font-size:16px}
select.inp{appearance:none;-webkit-appearance:none;background-image:linear-gradient(45deg,transparent 50%,var(--sub) 50%),linear-gradient(135deg,var(--sub) 50%,transparent 50%);
  background-position:calc(100% - 20px) 50%,calc(100% - 14px) 50%;background-size:6px 6px;background-repeat:no-repeat;padding-right:36px}
textarea.inp{resize:vertical;min-height:76px;line-height:1.4}
.inp:focus{outline:none;border-color:var(--focus);box-shadow:0 0 0 3px var(--focus-ring)}
.inp[aria-invalid="true"]{border-color:var(--danger)}
.err{color:var(--danger);font-size:14px;font-weight:600}
.two{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px;align-items:end}
@media (max-width:420px){ .two.st{grid-template-columns:1fr} }
.note{background:var(--warn-soft);color:var(--warn-ink);border-radius:12px;padding:12px 14px;font-size:15px;font-weight:600}
.okbox{background:var(--ok-soft);color:var(--ok-ink);border-radius:12px;padding:12px 14px;font-size:15px;font-weight:600;display:flex;gap:10px;align-items:center}
.info{background:var(--info-soft);color:var(--info-ink);border-radius:12px;padding:12px 14px;font-size:15px}

/* üst */
.top{display:flex;align-items:center;gap:12px;padding:calc(12px + var(--safe-t)) 16px 12px;background:var(--bg);border-bottom:1px solid var(--sep);position:sticky;top:0;z-index:5}
.top .logo{width:40px;height:40px;border-radius:12px;background:var(--accent);color:var(--on-accent);display:grid;place-items:center;font-weight:900;font-size:13px;letter-spacing:-.02em;flex:none}
.top .t{flex:1;min-width:0}
.top .t b{display:block;font-size:17px;line-height:1.2;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.top .t span{font-size:14px;color:var(--sub)}
.top select{max-width:46%;min-height:42px}
.demo-bar{background:var(--warn-soft);color:var(--warn-ink);font-size:14px;font-weight:600;padding:8px 16px;display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.demo-bar a{color:inherit;border:1px solid currentColor;border-radius:14px;padding:3px 10px;text-decoration:none}

/* karşılama */
.hero{background:linear-gradient(160deg,var(--accent) 0%,#c2410c 100%);color:#fff;border-radius:20px;padding:24px 20px;display:flex;flex-direction:column;gap:12px}
.hero h1{font-size:clamp(24px,6.5vw,32px);line-height:1.15;font-weight:900;letter-spacing:-.02em}
.hero p{font-size:17px;opacity:.95}
.hero .btn{background:#fff;color:#b0420a;font-size:17px;min-height:54px}
.hero .ghost-w{color:#fff;font-weight:700;text-decoration:underline;background:none;border:0;padding:4px 0;align-self:flex-start;font-size:15px}
.fayda{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:10px}
.fayda li{background:var(--bg);border-radius:14px;padding:14px;display:flex;gap:12px;align-items:flex-start;box-shadow:var(--shadow)}
.fayda .e{font-size:26px;line-height:1}
.fayda b{display:block}
.fayda span{font-size:14px;color:var(--sub)}
.adimlar{counter-reset:a;display:flex;flex-direction:column;gap:12px}
.adimlar li{counter-increment:a;display:flex;gap:12px;align-items:flex-start}
.adimlar li::before{content:counter(a);flex:none;width:30px;height:30px;border-radius:50%;background:var(--accent-soft);color:var(--accent-ink);font-weight:800;display:grid;place-items:center}
.adimlar b{display:block}
.adimlar span{font-size:14px;color:var(--sub)}

/* paketler */
.paketler{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:12px}
.paket{position:relative;border:2px solid var(--sep);border-radius:16px;padding:16px;background:var(--bg);text-align:left;display:flex;flex-direction:column;gap:8px;color:inherit;width:100%}
.paket[aria-checked="true"]{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
.paket .ad{font-size:18px;font-weight:800}
.paket .fiyat{font-size:26px;font-weight:900;letter-spacing:-.02em}
.paket .fiyat small{font-size:15px;font-weight:600;color:var(--sub)}
.paket ul{display:flex;flex-direction:column;gap:4px;font-size:15px}
.paket li::before{content:"✓ ";color:var(--ok-ink);font-weight:800}
.paket .rozet{position:absolute;top:-11px;right:14px;background:var(--accent);color:var(--on-accent);font-size:12px;font-weight:800;padding:3px 10px;border-radius:999px}
.paket.yeni-pk{border-style:dashed;justify-content:center;gap:6px;background:var(--bg2)}
.paket .ypk-t{font-size:15px;color:var(--sub);line-height:1.4}
.paket .ypk-d{font-weight:800;color:var(--link)}
.paket .rozet.ozelr{background:var(--ok);color:var(--on-ok)}
.ozel-pill{display:inline-block;font-size:13px;font-weight:800;padding:2px 10px;border-radius:999px;background:var(--ok-soft);color:var(--ok-ink);vertical-align:3px}
.teklif{box-shadow:inset 0 0 0 2px var(--ok);margin-bottom:12px}
.tk-ust{display:flex;align-items:baseline;justify-content:space-between;gap:10px;flex-wrap:wrap}
.tk-ust .ad{font-size:19px;font-weight:800}
.tk-ust .fiyat{font-size:26px;font-weight:900;letter-spacing:-.02em}
.tk-ust .fiyat small{font-size:15px;font-weight:600;color:var(--sub)}
.tk-l{list-style:none;padding:0;margin:0;display:flex;flex-direction:column;gap:4px;font-size:15px}
.tk-l li::before{content:"✓ ";color:var(--ok-ink);font-weight:800}
.oneri{display:flex;flex-direction:column;gap:4px;background:var(--ok-soft);color:var(--ok-ink);border-radius:12px;padding:12px 14px;font-size:15px}
.paket .simdi{font-size:13px;font-weight:700;color:var(--ok-ink)}
.secimler{display:grid;grid-template-columns:1fr 1fr;gap:10px}
@media (max-width:380px){.secimler{grid-template-columns:1fr}}
.secim{border:2px solid var(--sep);border-radius:14px;padding:12px 14px;background:var(--bg);text-align:left;display:flex;flex-direction:column;gap:4px;color:inherit;width:100%;min-height:44px}
.secim[aria-checked="true"]{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
.secim b{font-size:16px;font-weight:800}
.secim span{font-size:13px;color:var(--sub);line-height:1.35}
.hero .btn.ikinci{background:transparent;color:inherit;box-shadow:inset 0 0 0 2px currentColor}

/* sihirbaz */
.adim-bar{display:flex;gap:6px}
.adim-bar span{flex:1;height:6px;border-radius:3px;background:var(--sep)}
.adim-bar span.on{background:var(--accent)}
.turler{display:flex;flex-wrap:wrap;gap:8px}
.chip{min-height:44px;padding:0 16px;border-radius:22px;border:0;background:var(--bg2);font-weight:600;font-size:15px;box-shadow:inset 0 0 0 1px var(--sep)}
.chip[aria-checked="true"]{background:var(--accent);color:var(--on-accent);box-shadow:none}
details.ek{border-top:1px solid var(--sep);padding-top:10px}
details.ek summary{cursor:pointer;color:var(--link);font-weight:700;min-height:40px;display:flex;align-items:center}
.belge{display:flex;align-items:center;gap:12px;padding:12px 14px;border-radius:12px;background:var(--bg2);width:100%;border:0;text-align:left;color:inherit;min-height:64px}
.belge .d{flex:1;min-width:0}
.belge .d b{display:block}
.belge .d span{font-size:14px;color:var(--sub)}
.belge .tik{width:28px;height:28px;border-radius:50%;box-shadow:inset 0 0 0 2px var(--field-line);display:grid;place-items:center;flex:none}
.belge[data-onay="1"] .tik{background:var(--ok);box-shadow:none;color:var(--on-ok)}

/* panel */
.ozet{display:flex;flex-direction:column;gap:6px}
.ozet .ad{font-size:22px;font-weight:900;letter-spacing:-.01em}
.kodlar{display:flex;flex-wrap:wrap;gap:8px}
.kod{display:inline-flex;align-items:center;gap:8px;background:var(--bg2);border-radius:10px;padding:6px 10px;font-weight:700}
.kod code{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:16px}
.rozet2{display:inline-flex;padding:3px 10px;border-radius:999px;font-size:13px;font-weight:700;background:var(--accent-soft);color:var(--accent-ink)}
.rozet2.ok{background:var(--ok-soft);color:var(--ok-ink)}
.rozet2.bad,.note.bad{background:var(--danger-soft,#fdeceb);color:var(--danger)}
.bakiye{display:flex;align-items:baseline;justify-content:space-between;gap:12px;background:var(--bg2);border-radius:12px;padding:12px 14px}
.bakiye span{color:var(--sub);font-size:15px}
.bakiye b{font-size:26px;font-weight:800}
.havale{display:flex;flex-direction:column;gap:8px;border-top:1px solid var(--sep);padding-top:12px}
.mini{border:1px solid var(--sep);background:var(--bg2);color:var(--link);border-radius:8px;font-size:13px;font-weight:700;padding:3px 8px;margin-inline-start:6px;vertical-align:1px}
.hareket summary{cursor:pointer;font-weight:700;color:var(--link);min-height:40px;display:flex;align-items:center}
.hareket .blist li > span:first-child{display:flex;flex-direction:column;gap:2px;min-width:0}
.hareket .art{color:var(--ok-ink);font-weight:700;white-space:nowrap}
.hareket .eks{font-weight:700;white-space:nowrap}
.kurulum{display:flex;flex-direction:column;gap:8px}
.kur{display:flex;align-items:center;gap:12px;padding:12px;border-radius:12px;background:var(--bg2)}
.kur .n{width:30px;height:30px;border-radius:50%;flex:none;display:grid;place-items:center;font-weight:800;background:var(--bg);box-shadow:inset 0 0 0 2px var(--field-line)}
.kur.ok .n{background:var(--ok);color:var(--on-ok);box-shadow:none}
.kur .d{flex:1;min-width:0}
.kur .d b{display:block}
.kur .d span{font-size:14px;color:var(--sub)}
.kur .btn{flex:none}
.ilerleme{height:10px;border-radius:5px;background:var(--bg2);overflow:hidden}
.ilerleme span{display:block;height:100%;background:var(--ok);border-radius:5px}
.kullanim{display:flex;flex-direction:column;gap:12px}
.kl .ust{display:flex;justify-content:space-between;gap:10px;font-size:15px}
.kl .ust b{font-variant-numeric:tabular-nums}
.kl .bar{height:8px;border-radius:4px;background:var(--bg2);overflow:hidden;margin-top:4px}
.kl .bar span{display:block;height:100%;background:var(--ok)}
.kl.warn .bar span{background:var(--accent)}
.kl.full .bar span{background:var(--danger-fill)}
.kv{display:grid;grid-template-columns:auto minmax(0,1fr);gap:6px 14px;font-size:15px}
.kv dt{color:var(--sub)}
.kv dd{margin:0;overflow-wrap:anywhere;font-weight:600}
.blist li{display:flex;justify-content:space-between;gap:10px;padding:8px 0;border-bottom:1px solid var(--sep);font-size:15px}
.blist li:last-child{border-bottom:0}
.vid{display:flex;flex-direction:column;gap:4px}

/* bot rehberi */
.rehber{counter-reset:r;display:flex;flex-direction:column;gap:14px}
.rehber > li{counter-increment:r;display:grid;grid-template-columns:34px minmax(0,1fr);gap:12px}
.rehber > li::before{content:counter(r);width:34px;height:34px;border-radius:50%;background:var(--accent);color:var(--on-accent);font-weight:800;display:grid;place-items:center}
.rehber b{display:block;margin-bottom:2px}
.rehber .tip{margin-top:2px}
.kmt{display:inline-flex;align-items:center;gap:8px;background:var(--bg2);border-radius:10px;padding:6px 6px 6px 12px;font-family:ui-monospace,Menlo,Consolas,monospace;font-weight:700;margin-top:6px}
.kmt button{border:0;background:var(--bg);border-radius:8px;min-height:34px;padding:0 10px;font-family:var(--font);font-weight:700;font-size:14px;color:var(--link)}
.tokenrow{display:flex;gap:8px}
.tokenrow .inp{flex:1;min-width:0;font-family:ui-monospace,Menlo,Consolas,monospace;font-size:15px}
.tokenrow .btn{flex:none}
.qr{align-self:center;background:#fff;padding:12px;border-radius:12px;line-height:0}
.qr svg{display:block;width:180px;height:180px}
.linkbox{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:15px;background:var(--bg2);border-radius:12px;padding:12px 14px;overflow-wrap:anywhere;user-select:all;-webkit-user-select:all}

/* alt pencere */
.sheet-wrap{position:fixed;inset:0;z-index:50;display:flex;align-items:flex-end;justify-content:center}
.scrim{position:absolute;inset:0;background:var(--scrim)}
.sheet{position:relative;width:100%;max-width:640px;max-height:92%;background:var(--bg);border-radius:18px 18px 0 0;display:flex;flex-direction:column;outline:none}
@media (min-width:700px) and (min-height:560px){ .sheet-wrap{align-items:center;padding:24px} .sheet{border-radius:18px;max-height:min(88vh,900px)} }
.sh-head{flex:none;display:flex;align-items:center;gap:10px;padding:14px 12px 10px 18px;border-bottom:1px solid var(--sep)}
.sh-head h2{font-size:19px;font-weight:800;flex:1;min-width:0}
.icon-btn{flex:none;width:44px;height:44px;border:0;border-radius:12px;background:var(--bg2);display:grid;place-items:center}
.sh-body{flex:1;min-height:0;overflow-y:auto;padding:14px 18px 18px;display:flex;flex-direction:column;gap:14px;overscroll-behavior:contain}
.sh-foot{flex:none;padding:12px 18px calc(12px + var(--safe-b));border-top:1px solid var(--sep);display:flex;flex-direction:column;gap:8px}
.metin{font-size:15px;line-height:1.55}
.metin h1{font-size:19px;margin:0 0 8px}
.metin h2{font-size:16px;margin:16px 0 4px}
.metin p,.metin li{margin:4px 0}
.metin ol{list-style:decimal;padding-left:22px}
.metin ul{list-style:disc;padding-left:22px}
.metin table{border-collapse:collapse;width:100%;font-size:14px;margin:8px 0;display:block;overflow-x:auto}
.metin td,.metin th{border:1px solid var(--sep);padding:6px 8px;text-align:left;white-space:nowrap}
.full{min-height:70vh;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;gap:14px;padding:32px 20px}
.full .ic{width:76px;height:76px;border-radius:50%;background:var(--bg);display:grid;place-items:center;font-size:38px}
.full h1{font-size:23px;font-weight:900;max-width:24ch}
.full p{color:var(--sub);max-width:38ch}
.full .btns{display:flex;flex-direction:column;gap:10px;width:100%;max-width:340px}
.toast{position:fixed;left:50%;top:calc(12px + var(--safe-t));transform:translate(-50%,-20px);opacity:0;z-index:70;background:var(--toast-bg);color:var(--toast-text);
  padding:12px 16px;border-radius:12px;font-size:15px;font-weight:600;max-width:min(92vw,480px);width:max-content;transition:opacity .2s,transform .2s;pointer-events:none;text-align:center}
.toast.on{opacity:1;transform:translate(-50%,0)}
.toast.err{background:var(--danger-fill);color:var(--on-danger)}
.sk{background:var(--sk);border-radius:14px;animation:skp 1.1s ease-in-out infinite alternate}
@keyframes skp{from{opacity:.55}to{opacity:1}}
@media (prefers-reduced-motion:reduce){ *{animation:none!important;transition:none!important} }
.secim.tek{width:100%;flex-shrink:0}
.belge-guncel{border:2px solid var(--accent, #E8590C)}
.belge-guncel details{margin:4px 0 12px}
.belge-guncel summary{cursor:pointer;font-weight:700}
.belge-guncel .degisen{margin:8px 0 0;padding-left:20px;font-size:14px;line-height:1.45}
.belge-guncel .degisen li{margin:6px 0}
.rehber-btn{margin-top:10px}
</style>
</head>

}

function oneriKullanici(ad){
  var t = { 'ç':'c', 'ğ':'g', 'ı':'i', 'ö':'o', 'ş':'s', 'ü':'u', 'İ':'i' };

  return (s || 'isletme') + '_siparis_bot';
}

  function hata(k, m, alan){ return { ok:false, kod:k, hata:m, alan:alan }; }
  var islem = {
    uyBaslat:function(){ return { ok:true, kullanici:{ id:'7000', ad:'Hasan Kaya', kullanici:'hasan' }, isletmeler:kopya(ISL), paketler:kopya(PKL), paketTalebi:TALEP ? kopya(TALEP) : null, turler:TUR, isKollari:IS_KOLLARI, denemeGun:14,
      videolar:[{ k:'uyelik', ad:'YourPOS 360\'a nasıl üye olunur?', url:'https://www.instagram.com/' }, { k:'bot', ad:'Telegram\'da kendi botunuzu oluşturma', url:'https://www.instagram.com/' },
        { k:'menu', ad:'Menü ve ürünleri ekleme', url:'https://www.instagram.com/' }], anaBot:'yourpos360_bot',
      belgeler:Object.keys(BELGE).map(function(t){ return { tur:t, ad:BELGE[t] }; }), destek:'destek@yourpos360.com',
      destekKonulari:[{ k:'bakiye', ad:'💳 Bakiye ve ödeme' }, { k:'iade', ad:'↩️ Bakiye iadesi' }, { k:'fatura', ad:'🧾 Fatura' }, { k:'paket', ad:'📦 Paket ve ücretler' },
        { k:'menu', ad:'🍽️ Menü ve ürünler' }, { k:'bot', ad:'🤖 Bot bağlantısı' }, { k:'siparis', ad:'🛵 Siparişler' }, { k:'teknik', ad:'🛠️ Teknik sorun' },
        { k:'oneri', ad:'💡 Öneri' }, { k:'diger', ad:'✉️ Diğer' }], sinir:5, admin:false, onayGerekli:ONAY, basvuru:BV ? kopya(BV) : undefined,
      durum:DUR ? kopya(DUR) : undefined, rehber:taban + 'rehber/isletme-rehberi.pdf',
      belgeGuncel:DUR && Q.get('belge') === '1' && !BG_ONAY ? { surum:'1.5', tarih:'08.10.2026', yururluk:'07.11.2026', isletmeler:[{ id:'ornek', ad:DUR.ad }],
        degisiklik:['YourPOS 360 yöneticileri; destek, sahte sipariş ve kötüye kullanımın önlenmesi ve istatistik amacıyla tüm işletmelerin müşteri kayıtlarını görüntüleyebilir ve dışa aktarabilir.',
          'Her görüntüleme ve dışa aktarma kaydedilir; veriler satılmaz, reklam amacıyla kullanılmaz, hiçbir işletmeye başka bir işletmenin müşteri bilgisi gösterilmez.',
          'Müşteri aydınlatma metnine bu işleme ve YourPOS 360\'a başvuru yolu eklendi.',

    uyBelgeOnay:function(){ BG_ONAY = true; return { ok:true, mesaj:'Teşekkürler, onayınız kaydedildi. Onaylı belgeler Telegram sohbetinize gönderildi.', belgeGuncel:null }; },
    uyBelge:function(d){
      if (!BELGE[d.tur]) return hata('ISTEK', 'Belge bulunamadı.');

          '<h2>Madde 1 — Taraflar</h2><p>Bir tarafta <b>YourPOS 360</b> ile diğer tarafta üyelik sırasında bilgileri girilen işletme arasında…</p>' +

    },
    uyKayit:function(d){
      var f = d.form || {};

      var b = d.bilgi || {};

      if (b.isKolu !== undefined) { DUR.isKolu = b.isKolu; DUR.isKoluSecildi = true; delete b.isKolu; }
      if (b.rehberGizli !== undefined) { DUR.rehberGizli = !!b.rehberGizli; delete b.rehberGizli; }
      Object.keys(b).forEach(function(k){ DUR.bilgi[k] = b[k]; }); return { ok:true, durum:kopya(DUR) };

    uyBelgeGonder:function(){ return { ok:true, adet:3 }; },
    uyDestek:function(d){

    uyOdemeKontrol:function(){

    },
    uySablon:function(){ return { ok:true }; },
    uyOzelTalep:function(d){
      var o = paketOner({ urun:Number(d.urun), hafta:Number(d.hafta), ekip:Number(d.ekip) });
      if (o) return { ok:false, kod:'YAKIN', hata:'İhtiyacınız ' + o.paket.ad + ' paketiyle karşılanıyor.', paket:kopya(o.paket), neden:o.neden };
      TALEP = { no:'P-1002', durum:'bekliyor', tarih:'08.10.2026 10:12', urun:Number(d.urun), hafta:Number(d.hafta), ekip:Number(d.ekip), not:d.not || '', paket:null, karar:'' };
      return { ok:true, talep:kopya(TALEP) };
    },
    uyTeklif:function(d){
      if (!TALEP || TALEP.durum !== 'teklif') return hata('DURUM', 'Bu teklif artık geçerli değil.');
      if (d.karar === 'ret') { TALEP = null; PKL = PAKET.slice(); return { ok:true, paketTalebi:null, paketler:kopya(PKL) }; }
      DUR.paket = kopya(OZP); TALEP = null;

      DUR.satinTalep = { no:'B-1002', tarih:'06.10.2026 21:20' }; return { ok:true, no:'B-1002', metin:'Talebiniz alındı.', durum:kopya(DUR) };
    }

  return function(act, d){
    return new Promise(function(ok){
      setTimeout(function(){ var f = islem[act]; ok(f ? f(d) : hata('ISTEK', 'Bilinmeyen işlem.')); }, act === 'uyKayit' ? 1400 : 350);
    });
  };
}
})();
