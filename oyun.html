<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cut">
<meta name="robots" content="noindex">
<title>Oyunlar</title>
<style>
/* YourPOS 360 · Mekânda oyunlar (oyun.html). Masa oturumu sipariş sayfasıyla ortak (aynı tarayıcı deposu). */
:root{
  --font:-apple-system,BlinkMacSystemFont,"SF Pro Text",Roboto,"Segoe UI","Helvetica Neue",Arial,sans-serif;
  --bg2:#f1f2f6; --bg:#fff; --text:#0f0f0f; --hint:#8a8a8f; --sub:#5d5d63; --link:#2481cc; --sep:#e2e3e8;
  --accent:#e8590c; --on-accent:#fff; --accent-soft:#fdebdf; --accent-ink:#b0420a;
  --ok:#2e9e4f; --ok-soft:#e1f3e6; --ok-ink:#1d7536; --danger:#cf3a30; --danger-soft:#fdeceb; --warn-soft:#fff2dc; --warn-ink:#7f4600;
  --felt:#1f6b46; --felt2:#185a3a; --wood:#c58b4e; --wood2:#a86f36; --pt1:#f3e2c4; --pt2:#9a3b2c; --chk0:#fbfbf8; --chk1:#2b2b30;
  --card:#fff; --card-ink:#1b1b1f; --card-red:#c62828; --scrim:rgb(10 14 20 / .45);
  color-scheme:light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg2:#0e1621; --bg:#17212b; --text:#f5f5f5; --hint:#708499; --sub:#a6b2c0; --link:#62a8eb; --sep:#26323f;
    --accent-soft:#3a2416; --accent-ink:#ffab7d; --ok-soft:#173826; --ok-ink:#7bd69a; --danger-soft:#3a1d1b; --warn-soft:#3a2c12; --warn-ink:#f5c77a;
    --felt:#174f35; --felt2:#123f2a; --card:#f4f4f2; color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg2:#0e1621; --bg:#17212b; --text:#f5f5f5; --hint:#708499; --sub:#a6b2c0; --link:#62a8eb; --sep:#26323f;
  --accent-soft:#3a2416; --accent-ink:#ffab7d; --ok-soft:#173826; --ok-ink:#7bd69a; --danger-soft:#3a1d1b; --warn-soft:#3a2c12; --warn-ink:#f5c77a;
  --felt:#174f35; --felt2:#123f2a; --card:#f4f4f2; color-scheme:dark;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0;background:var(--bg2);color:var(--text);font:16px/1.4 var(--font);-webkit-text-size-adjust:100%}
body{min-height:100vh}
button{font:inherit;color:inherit}
a{color:var(--link)}
.ust{position:sticky;top:0;z-index:20;display:flex;align-items:center;gap:10px;padding:10px 16px;background:var(--bg);border-bottom:1px solid var(--sep)}
.ust .geri{text-decoration:none;font-weight:600;white-space:nowrap}
.ust h1{font-size:18px;margin:0;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ust .isl{color:var(--hint);font-size:13px;max-width:40%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
main{max-width:720px;margin:0 auto;padding:12px 16px 120px}
.kart-k{background:var(--bg);border-radius:14px;padding:14px;margin:0 0 12px;box-shadow:0 1px 0 var(--sep)}
.h2{font-size:16px;font-weight:700;margin:4px 0 10px}
.muted{color:var(--hint)}
.fhint{color:var(--sub);font-size:13px;margin:4px 0 0}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;min-height:44px;padding:0 16px;border-radius:12px;border:0;font-weight:700;cursor:pointer;background:var(--accent-soft);color:var(--accent-ink)}
.btn.pri{background:var(--accent);color:var(--on-accent)}
.btn.duz{background:transparent;color:var(--link);padding:0 8px}
.btn.kirmizi{background:var(--danger-soft);color:var(--danger)}
.btn[disabled]{opacity:.5;cursor:default}
.btn.blok{width:100%}
.btn.sm{min-height:34px;padding:0 12px;font-size:14px;border-radius:10px}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.seg{display:grid;grid-template-columns:1fr 1fr;background:var(--bg);border-radius:12px;padding:4px;margin:0 0 12px}
.seg button{border:0;background:transparent;min-height:40px;border-radius:9px;font-weight:700;color:var(--sub);cursor:pointer}
.seg button[aria-selected="true"]{background:var(--accent);color:var(--on-accent)}
.oyunlar{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.oy-k{background:var(--bg);border-radius:14px;padding:12px;display:flex;flex-direction:column;gap:8px;box-shadow:0 1px 0 var(--sep)}
.oy-k .i{font-size:30px;line-height:1}
.oy-k b{font-size:16px}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{border:1px solid var(--sep);background:var(--bg2);border-radius:999px;min-height:34px;padding:0 12px;font-weight:600;font-size:14px;cursor:pointer}
.chip:hover{border-color:var(--accent)}
.liste{display:flex;flex-direction:column;gap:8px}
.ms{background:var(--bg);border-radius:14px;padding:12px;display:flex;gap:12px;align-items:center;box-shadow:0 1px 0 var(--sep)}
.ms .i{font-size:26px}
.ms .a{flex:1;min-width:0}
.ms .a b{display:block}
.ms .a span{color:var(--sub);font-size:13px}
.rozet{display:inline-block;font-size:12px;font-weight:700;border-radius:999px;padding:2px 8px;background:var(--ok-soft);color:var(--ok-ink)}
.rozet.tur{background:var(--warn-soft);color:var(--warn-ink)}
.cb{display:flex;gap:10px;align-items:flex-start;border:0;background:transparent;text-align:start;padding:8px 0;cursor:pointer;width:100%}
.cb .kutu{flex:none;width:22px;height:22px;border-radius:6px;border:2px solid var(--hint);margin-top:1px;display:flex;align-items:center;justify-content:center;font-size:14px;color:#fff}
.cb[aria-checked="true"] .kutu{background:var(--accent);border-color:var(--accent)}
.err{color:var(--danger);font-size:14px;margin:6px 0 0}
.koltuklar{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:8px}
.koltuk{border:1px dashed var(--sep);border-radius:12px;padding:12px;text-align:center;min-height:64px;display:flex;flex-direction:column;justify-content:center}
.koltuk.dolu{border-style:solid;background:var(--accent-soft)}
.not{background:var(--warn-soft);color:var(--warn-ink);border-radius:10px;padding:8px 12px;font-size:13px;margin:0 0 12px}
.oyuncular{display:flex;gap:6px;flex-wrap:wrap;margin:0 0 10px}
.oyc{display:inline-flex;align-items:center;gap:6px;background:var(--bg);border-radius:999px;padding:6px 12px;font-size:14px;font-weight:600;box-shadow:0 1px 0 var(--sep)}
.oyc.sira{outline:2px solid var(--accent)}
.oyc .nokta{width:8px;height:8px;border-radius:50%;background:var(--ok)}
.oyc .nokta.yok{background:var(--hint)}
.olay{min-height:22px;font-size:14px;color:var(--sub);margin:6px 0;text-align:center}
.durum{font-weight:700;text-align:center;margin:6px 0 10px}
.durum.ben{color:var(--accent-ink)}
/* sohbet */
.sohbet{position:fixed;left:0;right:0;bottom:0;z-index:15;background:var(--bg);border-top:1px solid var(--sep);max-width:720px;margin:0 auto;padding-bottom:env(safe-area-inset-bottom,0)}
.sohbet .bas{display:flex;align-items:center;justify-content:space-between;width:100%;border:0;background:transparent;padding:10px 16px;font-weight:700;cursor:pointer}
.sohbet .yeni{background:var(--accent);color:#fff;border-radius:999px;font-size:12px;padding:1px 7px;margin-inline-start:6px}
.sohbet .govde{max-height:42vh;overflow-y:auto;padding:0 16px 8px}
.sohbet form{display:flex;gap:8px;padding:8px 16px 12px}
.sohbet input{flex:1;min-width:0;min-height:42px;border-radius:12px;border:1px solid var(--sep);background:var(--bg2);color:var(--text);padding:0 12px;font:inherit}
.msj{margin:6px 0;display:flex;flex-direction:column;align-items:flex-start}
.msj.ben{align-items:flex-end}
.msj .b{background:var(--bg2);border-radius:12px;padding:6px 10px;max-width:85%;border:0;text-align:start;font:inherit;color:inherit;cursor:pointer}
.msj.ben .b{background:var(--accent-soft);cursor:default}
.msj .ad{font-size:12px;color:var(--sub);font-weight:700}
.sh{position:fixed;inset:0;z-index:40;background:var(--scrim);display:flex;align-items:flex-end;justify-content:center}
.sh[hidden]{display:none}
.sh-k{background:var(--bg);width:100%;max-width:560px;border-radius:18px 18px 0 0;padding:16px 16px calc(16px + env(safe-area-inset-bottom,0));max-height:86vh;overflow-y:auto}
.toast{position:fixed;left:50%;bottom:90px;transform:translateX(-50%);z-index:50;background:#2a2b30;color:#fff;padding:10px 14px;border-radius:12px;max-width:90vw;font-size:14px}
.toast[hidden]{display:none}
.sonuc{background:var(--bg);border-radius:16px;padding:16px;text-align:center;margin:0 0 12px;box-shadow:0 2px 12px rgb(0 0 0 / .08)}
.sonuc h2{margin:0 0 6px}
.yuk{display:flex;justify-content:center;padding:60px 0}
.spin{width:28px;height:28px;border-radius:50%;border:3px solid var(--sep);border-top-color:var(--accent);animation:don 1s linear infinite}
@keyframes don{to{transform:rotate(360deg)}}
/* ---- tavla ---- */
.tv{background:var(--wood);border-radius:12px;padding:8px;user-select:none;-webkit-user-select:none}
.tv-ic{display:grid;grid-template-columns:1fr 26px 1fr 34px;gap:4px;background:var(--wood2);border-radius:8px;padding:4px}
.tv-yari{display:grid;grid-template-rows:1fr 1fr;gap:10px;background:var(--felt);border-radius:6px;padding:4px}
.tv-sira{display:grid;grid-template-columns:repeat(6,1fr);gap:2px}
.tv-n{position:relative;height:150px;border:0;padding:0;background:transparent;cursor:default;display:flex;flex-direction:column;align-items:center;gap:1px}
.tv-n::before{content:"";position:absolute;inset:0;clip-path:polygon(0 0,100% 0,50% 92%);background:var(--pt1);opacity:.95}
.tv-n.alt::before{clip-path:polygon(50% 8%,100% 100%,0 100%)}
.tv-n.c::before{background:var(--pt2)}
.tv-n.alt{flex-direction:column-reverse}
.tv-n.kay::before{background:#f0b429}
.tv-n.hed::before{background:#5fd38d}
.tv-n.oyn{cursor:pointer}
.tv-p{position:relative;z-index:1;width:min(22px,92%);aspect-ratio:1;border-radius:50%;border:1px solid rgb(0 0 0 / .35);box-shadow:inset 0 -2px 0 rgb(0 0 0 / .2)}
.tv-p.b{background:var(--chk0)}
.tv-p.s{background:var(--chk1);border-color:#000}
.tv-say{position:relative;z-index:1;font-size:11px;font-weight:800;color:#fff;text-shadow:0 1px 2px #000}
.tv-no{position:absolute;z-index:1;font-size:9px;color:rgb(255 255 255 / .7);bottom:-1px}
.tv-n.alt .tv-no{top:-1px;bottom:auto}
.tv-bar{background:var(--wood);border-radius:6px;display:flex;flex-direction:column;justify-content:space-between;align-items:center;padding:6px 0;border:0;cursor:default}
.tv-bar.oyn{cursor:pointer;outline:2px solid #f0b429}
.tv-off{background:var(--wood);border-radius:6px;display:flex;flex-direction:column;justify-content:space-between;align-items:center;padding:6px 2px;border:0;font-size:11px;color:#fff;font-weight:700;cursor:default}
.tv-off.hed{outline:3px solid #5fd38d;cursor:pointer}
.zarlar{display:flex;gap:10px;justify-content:center;align-items:center;margin:10px 0}
.zar{width:44px;height:44px;border-radius:10px;background:#fff;color:#111;display:flex;align-items:center;justify-content:center;font-size:24px;font-weight:800;box-shadow:0 2px 0 rgb(0 0 0 / .25)}
.zar.kul{opacity:.35}
/* ---- kartlar ---- */
.kart{display:inline-flex;flex-direction:column;justify-content:space-between;width:56px;height:80px;border-radius:8px;background:var(--card);color:var(--card-ink);border:1px solid rgb(0 0 0 / .2);padding:4px 5px;font-weight:800;line-height:1;box-shadow:0 2px 3px rgb(0 0 0 / .18);vertical-align:top}
.kart.kirmizi{color:var(--card-red)}
.kart .k-d{font-size:17px}
.kart .k-r{font-size:24px;align-self:flex-end}
.kart.arka{background:repeating-linear-gradient(45deg,#2e5aa8 0 6px,#244a8c 6px 12px);border-color:#1d3d73}
.kart.kucuk{width:34px;height:48px;padding:2px 3px}
.kart.kucuk .k-d{font-size:12px}.kart.kucuk .k-r{font-size:15px}
button.kart{cursor:pointer;transition:transform .12s}
button.kart.sec{transform:translateY(-14px);outline:3px solid var(--accent)}
button.kart[disabled]{cursor:default}
.ps{background:var(--felt);border-radius:16px;padding:12px;color:#fff}
.ps-rakip{display:flex;justify-content:space-around;gap:8px;margin:0 0 10px;flex-wrap:wrap}
.ps-r{display:flex;flex-direction:column;align-items:center;gap:4px;font-size:13px;font-weight:700}
.ps-r.sira{color:#ffd56a}
.ps-r .arkalar{display:flex}
.ps-r .arkalar .kart{margin-inline-start:-22px}
.ps-r .arkalar .kart:first-child{margin-inline-start:0}
.ps-orta{display:flex;align-items:center;justify-content:center;gap:16px;min-height:110px}
.ps-yer{position:relative;min-width:120px;height:96px;display:flex;align-items:center;justify-content:center}
.ps-yer .kart{position:absolute}
.ps-bilgi{font-size:13px;opacity:.9;text-align:center}
.ps-el{display:flex;justify-content:center;gap:6px;margin:14px 0 4px;min-height:96px;align-items:flex-end}
.ps-skor{display:flex;justify-content:space-between;gap:8px;font-size:14px;font-weight:700;margin-top:8px;background:rgb(0 0 0 / .2);border-radius:10px;padding:8px 10px}
/* okey */
.ok{background:var(--felt);border-radius:14px;padding:10px 8px;color:#fff;user-select:none;-webkit-user-select:none}
.ok-rakip{display:flex;justify-content:space-around;gap:6px;margin:0 0 10px;flex-wrap:wrap}
.ok-r{display:flex;flex-direction:column;align-items:center;gap:3px;font-size:13px;min-width:80px}
.ok-r.sira b{color:#ffd56a}
.ok-r .muted{color:rgb(255 255 255 / .75);font-size:12px}
.ok-orta{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;align-items:start;margin:0 0 10px}
.ok-o{display:flex;flex-direction:column;align-items:center;gap:4px;font-size:11px;color:rgb(255 255 255 / .85);text-align:center;background:none;border:0;padding:4px 2px;border-radius:10px;font:inherit;font-size:11px}
button.ok-o{cursor:pointer;outline:2px dashed rgb(255 255 255 / .55)}
button.ok-o[disabled]{outline:0;cursor:default}
.ok-deste{width:34px;height:46px;border-radius:6px;background:repeating-linear-gradient(45deg,#e8dcc2 0 5px,#d9caa8 5px 10px);border:1px solid rgb(0 0 0 / .3);display:flex;align-items:center;justify-content:center;color:#5a4a2a;font-weight:800;font-size:13px}
.tas{position:relative;display:inline-flex;align-items:center;justify-content:center;flex-direction:column;width:30px;height:42px;border-radius:6px;background:#fbf6e8;border:1px solid rgb(0 0 0 / .25);box-shadow:0 2px 0 #d6cba9;font-weight:900;font-size:17px;line-height:1;padding:0;font-family:inherit;vertical-align:top}
.tas.kucuk{width:24px;height:34px;font-size:13px}
.tas.bos{background:rgb(0 0 0 / .18);border:1px dashed rgb(255 255 255 / .35);box-shadow:none}
.tas.r-y{color:#d79a00}.tas.r-b{color:#1565c0}.tas.r-k{color:#1b1b1f}.tas.r-r{color:#c62828}
.tas .yz{position:absolute;top:1px;right:2px;font-size:9px;color:#c62828}
.tas .sn{font-size:9px;font-weight:700;opacity:.8}
button.tas{cursor:pointer}
button.tas.sec{transform:translateY(-8px);outline:3px solid #ffd56a}
button.tas.yeni{box-shadow:0 0 0 2px #5fd38d}
.ok-istaka{background:var(--wood);border-radius:10px;padding:6px 4px;display:grid;grid-template-rows:auto auto;gap:6px}
.ok-sira{display:grid;grid-template-columns:repeat(12,1fr);gap:2px;justify-items:center}
.ok-sira .tas{width:100%;max-width:30px}
button.ok-yer{width:100%;max-width:30px;height:42px;border-radius:6px;border:1px dashed rgb(255 255 255 / .25);background:rgb(0 0 0 / .08);padding:0}
.ok-dugmeler{display:flex;flex-wrap:wrap;justify-content:center;gap:6px;margin:10px 0 2px}
.ok-ipucu{text-align:center;font-size:13px;margin:8px 0 0;color:rgb(255 255 255 / .9)}
.ok-skor{display:flex;flex-wrap:wrap;justify-content:center;gap:4px 12px;font-size:13px;font-weight:700;margin-top:8px;background:rgb(0 0 0 / .2);border-radius:10px;padding:6px 10px}
.ok-acilan{display:flex;flex-wrap:wrap;justify-content:center;gap:2px;margin:6px 0}
</style>
</head>

<div id="sohbet" class="sohbet" hidden></div>
<div id="sheet" class="sh" hidden role="dialog" aria-modal="true"><div class="sh-k" id="sheetK"></div></div>

  var payload = Object.assign({ act:act, b:B, dil:LANG, masa:MASA, oturum:OTURUM }, data || {});
  if (MOCK) return MOCK(act, JSON.parse(JSON.stringify(payload)));
  var url = API + (API.indexOf('?') >= 0 ? '&' : '?') + 'api=1';
  return fetch(url, { method:'POST', body:JSON.stringify(payload), redirect:'follow' }).then(function(r){ return r.text(); }).then(function(x){
    try { return JSON.parse(x); } catch(e){ return { ok:false, kod:'SUNUCU', hata:t('hata') }; }

/* ---------- açılış ---------- */
function bilgiEkrani(baslik, metin, dugme){
  S.ekran = 'bilgi'; durdur();
  ana.innerHTML = '<div class="kart-k" style="text-align:center"><div style="font-size:44px">🎲</div><h2 class="h2">' + esc(baslik) + '</h2><p class="fhint">' + esc(metin) + '</p>' +
    (dugme ? '<p style="margin:14px 0 0"><a class="btn pri" href="' + esc(geriUrl()) + '">' + esc(dugme) + '</a></p>' : '') + '</div>';
  sohbetGizle();
}
function hataIsle(r){
  if (r && (r.kod === 'OTURUM' || r.kod === 'KAPANDI')) { bilgiEkrani(t('baslik'), (r && r.hata) || t('oturumYok'), t('masayaDon')); return true; }
  if (r && r.kod === 'KAPALI') { bilgiEkrani(t('baslik'), t('kapali'), ''); return true; }
  if (r && r.kod === 'UYGUN') { durdur(); lobiYukle(true); return true; }   // ekran neden uygun olmadığını gösterir
  return false;
}
function boot(){
  if (!B || !MASA) { bilgiEkrani(t('baslik'), t('oturumYok'), ''); return; }
  if (!OTURUM && !DEMO) { bilgiEkrani(t('baslik'), t('oturumYok'), t('masayaDon')); return; }
  lobiYukle(true);
}
function lobiYukle(ilk){
  return call('oyLobi').then(function(r){
    if (!r || !r.ok) { if (!hataIsle(r)) { if (ilk) bilgiEkrani(t('baslik'), (r && r.hata) || t('hata'), ''); } return; }
    lobiAl(r, ilk);
  });
}
function lobiAl(r, ilk){
  S.lobi = r;
  if (!r.acik) { bilgiEkrani(t('baslik'), t('kapali'), ''); return; }
  if (!r.uygun) { uygunEkrani(r); return; }
  if (ilk && r.benim) { masayaGit(r.benim); return; }
  if (S.ekran !== 'lobi') { S.ekran = 'lobi'; S.masa = null; S.masaId = ''; sohbetGizle(); }
  cizLobi();
  zamanla(5000);
}
function zamanla(ms){ durdur(); S.pT = setTimeout(yokla, ms); }
function durdur(){ clearTimeout(S.pT); S.pT = null; }
function yokla(){
  if (d.hidden) { zamanla(3000); return; }
  if (S.ekran === 'lobi') { lobiYukle(false); return; }
  if (S.ekran === 'masa' && S.masaId) masaYukle(false);
}
d.addEventListener('visibilitychange', function(){ if (!d.hidden && (S.ekran === 'lobi' || S.ekran === 'masa')) zamanla(200); });

/* ---------- uygunluk: doğrulama, 18 yaş ve görünürlük ---------- */
function uygunEkrani(r){
  var b = r.ben || {};
  if (b.yasak) { bilgiEkrani(t('baslik'), t('yasak'), ''); return; }
  if (!b.dogrulandi) { bilgiEkrani(t('dgH'), t('dgS'), t('dgGit')); return; }
  S.ekran = 'bilgi'; durdur(); sohbetGizle();
  if (!S.gor) S.gor = { yas:!!b.yas18, hata:'' };
  S.gor.yasVar = !!b.yas18;
  gorCiz();
}
function gorCiz(){
  var o = S.gor;
  ana.innerHTML = '<div class="kart-k"><div style="font-size:40px;text-align:center">👀</div><h2 class="h2" style="text-align:center">' + esc(t('gorH')) + '</h2><p class="fhint">' + esc(t('gorS')) + '</p>' +
    (o.yasVar ? '' : '<button type="button" class="cb" role="checkbox" aria-checked="' + o.yas + '" data-act="gor-yas"><span class="kutu" aria-hidden="true">' + (o.yas ? '✓' : '') + '</span><span>' + esc(t('yas18')) + '</span></button>') +
    (o.hata ? '<p class="err" role="alert">' + esc(o.hata) + '</p>' : '') +
    '<p style="margin:12px 0 0"><button type="button" class="btn pri" style="width:100%" data-act="gor-ac"' + (S.busy ? ' disabled' : '') + '>' + esc(t('gorBtn')) + '</button></p></div>';
}
function gorAc(){
  var o = S.gor; if (!o || S.busy) return;
  if (!o.yasVar && !o.yas) { o.hata = t('yas18Hata'); gorCiz(); return; }
  S.busy = true; o.hata = ''; gorCiz();
  call('oyGorunur', { yas18:true }).then(function(r){
    S.busy = false;
    if (r && r.ok) { S.gor = null; lobiAl(r, true); return; }
    if (r && (r.kod === 'OTURUM' || r.kod === 'KAPANDI' || r.kod === 'KAPALI')) { hataIsle(r); return; }
    o.hata = (r && r.hata) || t('hata'); gorCiz();
  });
}

function turBul(k){ return ((S.lobi && S.lobi.turler) || []).filter(function(x){ return x.k === k; })[0] || null; }
function sekmeKisi(tur, sekme){ return tur.kisi.filter(function(n){ return sekme === 'iki' ? n <= 3 : n >= 4 || (tur.k === 'bilgi' && n >= 3); }); }
function kisiYazi(tur, l){ return l.length > 3 ? t('kisiAralik', { a:l[0], b:l[l.length - 1] }) : ''; }
function cizLobi(){
  var r = S.lobi, h = '';

  h += '<h2 class="h2">' + esc(t('masaAcH')) + '</h2><div class="oyunlar">';
  (r.turler || []).forEach(function(tr){
    var l = sekmeKisi(tr, S.sekme); if (!l.length) return;
    var aralik = kisiYazi(tr, l);
    h += '<div class="oy-k"><span class="i" aria-hidden="true">' + esc(tr.i) + '</span><b>' + esc(turAd(tr)) + '</b><div class="chips">' +
      (aralik ? '<button type="button" class="chip" data-act="ac-sec" data-k="' + esc(tr.k) + '" data-n="' + l[0] + '"' + (benim ? ' disabled' : '') + '>' + esc(aralik) + '</button>'
        : l.map(function(n){ return '<button type="button" class="chip" data-act="ac-sec" data-k="' + esc(tr.k) + '" data-n="' + n + '"' + (benim ? ' disabled' : '') + '>' + esc(t('kisiN', { n:n })) + '</button>'; }).join('')) +
      '</div></div>';
  });
  h += '</div><h2 class="h2" style="margin-top:18px">' + esc(t('acikMasalar')) + '</h2>';
  var ml = (r.masalar || []).filter(function(x){ return !x.ben && (x.d === 'B' || x.d === 'O'); });
  if (!ml.length) h += '<p class="muted">' + esc(t('masaYok')) + '</p>';
  else h += '<div class="liste">' + ml.map(function(x){
    var sag = x.d === 'O' ? '<span class="rozet tur">' + esc(t('oynaniyor')) + '</span>'
      : x.davet ? '<span class="row"><button type="button" class="btn sm" data-act="davet-hayir" data-id="' + esc(x.id) + '">' + esc(t('hayir')) + '</button><button type="button" class="btn pri sm" data-act="davet-evet" data-id="' + esc(x.id) + '">' + esc(t('kabul')) + '</button></span>'
      : x.istek ? '<span class="row"><span class="rozet">' + esc(t('istekGitti')) + '</span><button type="button" class="btn duz sm" data-act="istek-iptal" data-id="' + esc(x.id) + '">' + esc(t('iptal')) + '</button></span>'
      : '<button type="button" class="btn pri sm" data-act="katil" data-id="' + esc(x.id) + '"' + (benim ? ' disabled' : '') + '>' + esc(t('katil')) + '</button>';
    return '<div class="ms"><span class="i" aria-hidden="true">' + esc(x.i) + '</span><span class="a"><b>' + esc(turAd(x)) + ' · ' + esc(t('kisiN', { n:x.kisi })) + (x.mod ? ' · ' + esc(t(x.mod)) : '') + '</b>' +
      '<span>' + esc(t('masaSahibi', { ad:x.sahipAd })) + (x.d === 'B' ? ' · ' + esc(t('bosYer', { n:x.bos })) : '') + (x.davet ? ' · ' + esc(t('davetVar')) : '') + '</span></span>' + sag + '</div>';
  }).join('') + '</div>';

var CIZ = {}, EYLEM = {};
/* tavla: 0. oyuncu 23 → 0, evi 0–5. Ekranda kendi eviniz sağ altta. */
CIZ.tavla = function(m){

    var pul = ''; for (var q = 0; q < Math.min(n, 5); q++) pul += '<span class="tv-p ' + renk + '"></span>';
    if (n > 5) pul += '<span class="tv-say">' + n + '</span>';
    return '<button type="button" class="tv-n' + (alt ? ' alt' : '') + (j % 2 ? ' c' : '') + (kay ? ' kay' : '') + (hed ? ' hed' : '') + (oyn ? ' oyn' : '') + '" data-act="tv-n" data-i="' + i + '" aria-label="' + (j + 1) + '"' + (oyn ? '' : ' tabindex="-1"') + '>' +
      pul + '<span class="tv-no">' + (j + 1) + '</span></button>';
